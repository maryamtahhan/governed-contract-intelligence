<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Through-stack run — one request, six stops, three kinds of work</title>
  <desc id="d">Three grouped stages. The client stage is the batch runner: a CPU-side CLI that reads documents, builds prompts and scores answers. The record-and-decide stage has three stops: a trace-ui ingress relay that writes an audit row and forwards to praxis; praxis, which authenticates the per-step API key, fails closed on an unknown key, and matches the declarative X-Demo-Step header against the work-to-pool table (a sensitive entry also taints the document session); and a trace-ui pool relay that writes the model-call row and forwards to the chosen pool. The inference stage is the pool, which is only a route name in the config, and the model inside it, the only stop that runs inference. The response returns through the same hops and carries headers naming the entry, route and trace id. The work-to-pool table sends classify and data protection to vllm-cpu, the three CUAD clause extractions to cuad-specialist, and risk/report to vllm-gpu (general) or vllm-gpu-approved (sensitive); vllm-gpu-small appears only under the small-first config (retired name gpu-small). A green lane explains the sensitive path: PII-positive documents enter at the sensitive door, may route only to the specialist, CPU or approved GPU pool, and fail closed if the required pool is down. A separate control-plane note records the opt-in screen:pii route: the screen ingress on 8086 forwards to the Praxis screen listener, then the jev-cpu relay on 8089 and the Jev CPU pool; it is not one of the six measured stops.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9db1c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55e6a0"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8298"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#07111f"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#e9f2ff">Through-stack run — one request, six stops</text>
  <text x="40" y="68" font-size="12" fill="#9db1c8">three kinds of stop: your CLI · two recorders · a policy gate · a route name · one model</text>

  <!-- response path, above the stages -->
  <path d="M 1164 141 L 1164 92 L 140 92 L 140 139" fill="none" stroke="#6f8298" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <text x="650" y="84" font-size="10.5" fill="#6f8298" text-anchor="middle">the response returns through the same hops — the runner gets the answer and the recorded headers</text>

  <!-- stage 1: client -->
  <rect x="40" y="105" width="200" height="270" rx="10" fill="#0a1626" stroke="#2b4865" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="140" y="128" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5" text-anchor="middle">CLIENT · CPU</text>

  <rect x="55" y="145" width="170" height="190" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="140" y="172" font-size="12.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">1 · BATCH RUNNER</text>
  <text x="140" y="192" font-size="9.5" fill="#9db1c8" text-anchor="middle">hybrid-run</text>
  <text x="140" y="207" font-size="9.5" fill="#9db1c8" text-anchor="middle">--target gateway</text>
  <text x="140" y="234" font-size="10.5" fill="#c9d8ea" text-anchor="middle">reads documents</text>
  <text x="140" y="252" font-size="10.5" fill="#c9d8ea" text-anchor="middle">builds prompts</text>
  <text x="140" y="270" font-size="10.5" fill="#c9d8ea" text-anchor="middle">scores answers</text>
  <text x="140" y="298" font-size="9.5" fill="#6f8298" text-anchor="middle">classify · extract ×4 · risk</text>
  <text x="140" y="315" font-size="9.5" fill="#6f8298" text-anchor="middle">CPU-side · no model</text>

  <!-- stage 2: record + decide -->
  <rect x="270" y="105" width="640" height="270" rx="10" fill="#0a1626" stroke="#2b4865" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="590" y="128" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5" text-anchor="middle">RECORD + DECIDE · NO MODEL RUNS HERE</text>

  <rect x="285" y="145" width="186" height="190" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="378" y="172" font-size="12.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">2 · INGRESS RELAY</text>
  <text x="378" y="192" font-size="9.5" fill="#9db1c8" text-anchor="middle">trace-ui</text>
  <text x="378" y="222" font-size="10.5" fill="#c9d8ea" text-anchor="middle">writes an audit row</text>
  <text x="378" y="240" font-size="10.5" fill="#c9d8ea" text-anchor="middle">forwards to praxis</text>
  <text x="378" y="274" font-size="9.5" fill="#6f8298" text-anchor="middle">the two doors:</text>
  <text x="378" y="291" font-size="9" fill="#6f8298" text-anchor="middle">:8080 general · :8083 sensitive</text>

  <rect x="496" y="145" width="186" height="190" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="589" y="172" font-size="12.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">3 · POLICY + ROUTE</text>
  <text x="589" y="192" font-size="9.5" fill="#9db1c8" text-anchor="middle">praxis · PPE</text>
  <text x="589" y="222" font-size="10.5" fill="#c9d8ea" text-anchor="middle">authenticates every step</text>
  <text x="589" y="240" font-size="10.5" fill="#c9d8ea" text-anchor="middle">unknown key → fail closed</text>
  <text x="589" y="258" font-size="10.5" fill="#c9d8ea" text-anchor="middle">X-Demo-Step picks a pool</text>
  <text x="589" y="276" font-size="10.5" fill="#c9d8ea" text-anchor="middle">sensitive → taint session</text>
  <text x="589" y="308" font-size="9" fill="#6f8298" text-anchor="middle">the work-to-pool table decides</text>
  <text x="589" y="324" font-size="9" fill="#6f8298" text-anchor="middle">the pipeline never names a pool</text>

  <rect x="707" y="145" width="186" height="190" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="800" y="172" font-size="12.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">4 · POOL RELAY</text>
  <text x="800" y="192" font-size="9.5" fill="#9db1c8" text-anchor="middle">trace-ui</text>
  <text x="800" y="222" font-size="10.5" fill="#c9d8ea" text-anchor="middle">writes model-call row</text>
  <text x="800" y="240" font-size="10.5" fill="#c9d8ea" text-anchor="middle">forwards to the pool</text>
  <text x="800" y="274" font-size="9.5" fill="#6f8298" text-anchor="middle">one per pool:</text>
  <text x="800" y="291" font-size="9" fill="#6f8298" text-anchor="middle">:8088 specialist · :8081 cpu</text>
  <text x="800" y="306" font-size="9" fill="#6f8298" text-anchor="middle">:8082 gpu · :8084 approved · :8085 small</text>
  <text x="800" y="324" font-size="9" fill="#6f8298" text-anchor="middle">praxis never calls a pool directly</text>

  <!-- stage 3: inference -->
  <rect x="940" y="105" width="305" height="270" rx="10" fill="#0a1626" stroke="#2b4865" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1092" y="128" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5" text-anchor="middle">INFERENCE · THE ONLY MODEL WORK</text>

  <rect x="955" y="145" width="175" height="190" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="1042" y="172" font-size="12.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">5 · POOL</text>
  <text x="1042" y="192" font-size="9" fill="#9db1c8" text-anchor="middle">a route name, not hardware</text>
  <text x="1042" y="216" font-size="9.5" fill="#c9d8ea" text-anchor="middle">classify + data protection</text>
  <text x="1042" y="230" font-size="9.5" fill="#7fb2e5" text-anchor="middle">→ vllm-cpu</text>
  <text x="1042" y="251" font-size="9.5" fill="#c9d8ea" text-anchor="middle">CUAD clause extracts</text>
  <text x="1042" y="265" font-size="9.5" fill="#7fb2e5" text-anchor="middle">→ cuad-specialist</text>
  <text x="1042" y="286" font-size="9.5" fill="#c9d8ea" text-anchor="middle">risk + report</text>
  <text x="1042" y="300" font-size="9.5" fill="#7fb2e5" text-anchor="middle">→ vllm-gpu (general)</text>
  <text x="1042" y="314" font-size="9.5" fill="#7fb2e5" text-anchor="middle">→ vllm-gpu-approved (sensitive)</text>
  <text x="1042" y="329" font-size="8.5" fill="#6f8298" text-anchor="middle">small-first → vllm-gpu-small</text>

  <rect x="1140" y="145" width="88" height="190" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="1184" y="172" font-size="12.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">6 · MODEL</text>
  <text x="1184" y="192" font-size="9" fill="#9db1c8" text-anchor="middle">one model</text>
  <text x="1184" y="218" font-size="10" fill="#c9d8ea" text-anchor="middle">runs in</text>
  <text x="1184" y="234" font-size="10" fill="#c9d8ea" text-anchor="middle">the pool</text>
  <text x="1184" y="260" font-size="10" fill="#c9d8ea" text-anchor="middle">CPU or</text>
  <text x="1184" y="276" font-size="10" fill="#c9d8ea" text-anchor="middle">GPU</text>
  <text x="1184" y="306" font-size="9" fill="#6f8298" text-anchor="middle">answers</text>
  <text x="1184" y="321" font-size="9" fill="#6f8298" text-anchor="middle">the call</text>

  <!-- request arrows -->
  <line x1="229" y1="240" x2="281" y2="240" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="240" x2="492" y2="240" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="686" y1="240" x2="703" y2="240" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="897" y1="240" x2="951" y2="240" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1130" y1="240" x2="1137" y2="240" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- sensitive lane -->
  <rect x="270" y="405" width="975" height="115" rx="8" fill="#0a1f18" stroke="#55e6a0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="288" y="430" font-size="11.5" font-weight="700" fill="#55e6a0">SENSITIVE PATH — PII-positive documents use :8083, not :8080</text>
  <text x="288" y="454" font-size="11" fill="#c9d8ea">Praxis may route them only to cuad-specialist, vllm-cpu or vllm-gpu-approved. The general GPU pool is forbidden.</text>
  <text x="288" y="476" font-size="11" fill="#c9d8ea">If the required approved pool is down, the call fails closed with an explicit 502 — a policy decision, not a model error.</text>
  <text x="288" y="500" font-size="10.5" fill="#6f8298">The sensitive entry also taints the document session at the gateway, so a later step cannot silently move to a general pool.</text>
  <line x1="589" y1="337" x2="589" y2="401" stroke="#55e6a0" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>

  <!-- legend -->
  <line x1="40" y1="552" x2="70" y2="552" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="78" y="556" font-size="10.5" fill="#9db1c8">request</text>
  <line x1="150" y1="552" x2="180" y2="552" stroke="#6f8298" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <text x="188" y="556" font-size="10.5" fill="#9db1c8">response</text>
  <rect x="270" y="544" width="26" height="14" rx="3" fill="#0a1f18" stroke="#55e6a0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="304" y="556" font-size="10.5" fill="#9db1c8">sensitive / approved only</text>

  <text x="40" y="594" font-size="11" fill="#6f8298">Six stops, three kinds of work: the CLI builds and scores, the two relays record, praxis decides — only stop 6 runs a model. Port numbers repeat between trace-ui and praxis because they are separate pods.</text>
  <text x="40" y="616" font-size="10.5" fill="#6f8298">Control plane (opt-in, not in this run): screen:pii → Praxis :8086 → trace-ui :8089 → jev-cpu. The recorded screen stays regex; the opt-in Jev cause trigger failed its 0.714 F1 guardrail.</text>
</svg>
