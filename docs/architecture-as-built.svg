<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="664" viewBox="0 0 1280 664" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9db1c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55e6a0"/>
    </marker>
  </defs>

  <rect width="1280" height="664" fill="#07111f"/>

  <text x="40" y="48" font-size="20" font-weight="700" fill="#e9f2ff">As-built architecture — private, governed agents on hybrid CPU + GPU inference</text>
  <text x="40" y="72" font-size="12" fill="#9db1c8">clients → trace-ui relays → praxis (PPE identity gate → pinned policy) → pool · SQLite is the audit trail · gateway image v0.9.1 · updated 2026-11-10 · demo target: ROSA HCP</text>

  <!-- clients (left column) -->
  <rect x="40" y="104" width="250" height="76" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="165" y="134" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">CLIENT / REVIEW PIPELINE</text>
  <text x="165" y="156" font-size="11" fill="#9db1c8" text-anchor="middle">CUAD batch + 200-doc synthetic · PII screen picks the entry</text>

  <rect x="40" y="210" width="250" height="96" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="165" y="238" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">OPENSHELL SANDBOX</text>
  <text x="165" y="258" font-size="11" fill="#9db1c8" text-anchor="middle">OpenClaw agent, network locked:</text>
  <text x="165" y="274" font-size="11" fill="#9db1c8" text-anchor="middle">default-deny egress, denials logged</text>

  <!-- trace-ui -->
  <rect x="330" y="104" width="280" height="88" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="470" y="130" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">TRACE-UI</text>
  <text x="470" y="150" font-size="11" fill="#9db1c8" text-anchor="middle">recording relays · SQLite audit trail</text>
  <text x="470" y="168" font-size="11" fill="#9db1c8" text-anchor="middle">:8080/:8083 general + sensitive · :8086/:8087 judgment</text>

  <!-- praxis -->
  <rect x="650" y="100" width="300" height="96" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="800" y="128" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">PRAXIS GATEWAY</text>
  <text x="800" y="148" font-size="11" fill="#9db1c8" text-anchor="middle">PPE: per-step API-key gate · audit records</text>
  <text x="800" y="166" font-size="11" fill="#9db1c8" text-anchor="middle">pinned routing matrix · config hot-swap · failover</text>
  <text x="800" y="184" font-size="11" fill="#9db1c8" text-anchor="middle">shadow PII screen (observe-only) · no classifier</text>

  <!-- stage-aware judgment entries (praxis listeners) -->
  <rect x="990" y="110" width="250" height="86" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1115" y="134" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">JUDGMENT ENTRIES</text>
  <text x="1115" y="152" font-size="11" fill="#9db1c8" text-anchor="middle">risk + report pinned to GPU</text>
  <text x="1115" y="168" font-size="11" fill="#9db1c8" text-anchor="middle">:8086 judgment · :8087 sensitive-judgment</text>
  <text x="1115" y="184" font-size="11" fill="#55e6a0" text-anchor="middle">sensitive judgment: approved-only, fail closed</text>

  <!-- pools -->
  <!-- the approved set: the zone where sensitive data may be processed -->
  <rect x="44" y="378" width="726" height="154" rx="10" fill="#55e6a0" fill-opacity="0.04" stroke="#55e6a0" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="407" y="524" font-size="11" fill="#55e6a0" text-anchor="middle">APPROVED SET — sensitive data is processed only inside this boundary (fail-closed, never spills)</text>
  <rect x="60" y="390" width="320" height="118" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="220" y="416" font-size="13" font-weight="600" fill="#e9f2ff" text-anchor="middle">VLLM-CPU — x8i.24xlarge (48 cores, AMX)</text>
  <text x="220" y="436" font-size="11" fill="#9db1c8" text-anchor="middle">Qwen3.5-35B-A3B MoE · Qwen2.5-1.5B · CUAD specialist</text>
  <text x="220" y="452" font-size="11" fill="#9db1c8" text-anchor="middle">explicit OMP bind, one thread per physical core</text>
  <text x="220" y="468" font-size="11" fill="#9db1c8" text-anchor="middle">no static CPU manager; CPU request, no limit</text>
  <text x="220" y="486" font-size="11" fill="#9db1c8" text-anchor="middle">per-node gp3 model cache · one NUMA node per pool</text>

  <rect x="430" y="390" width="320" height="118" rx="8" fill="#0d1b2d" stroke="#55e6a0" stroke-width="1.5"/>
  <text x="590" y="416" font-size="13" font-weight="600" fill="#55e6a0" text-anchor="middle">VLLM-GPU-APPROVED</text>
  <text x="590" y="436" font-size="11" fill="#9db1c8" text-anchor="middle">pinned for SENSITIVE · fail-closed</text>
  <text x="590" y="452" font-size="11" fill="#9db1c8" text-anchor="middle">same gpumoe pods as vllm-gpu</text>
  <text x="590" y="468" font-size="11" fill="#9db1c8" text-anchor="middle">(a second deployment = 4 more GPUs)</text>

  <rect x="800" y="390" width="320" height="118" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="960" y="416" font-size="13" font-weight="600" fill="#e9f2ff" text-anchor="middle">VLLM-GPU · VLLM-GPU-SMALL</text>
  <text x="960" y="436" font-size="11" fill="#9db1c8" text-anchor="middle">gpumoe-vllm · Qwen3.5-35B-A3B</text>
  <text x="960" y="452" font-size="11" fill="#9db1c8" text-anchor="middle">4× A10G, TP=4 · configs A/B baselines</text>

  <!-- arrows: client -> trace-ui -->
  <line x1="290" y1="142" x2="326" y2="142" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- arrows: trace-ui -> praxis (two recorded entries) -->
  <line x1="610" y1="126" x2="646" y2="126" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="628" y="118" font-size="10" fill="#9db1c8" text-anchor="middle">:8080</text>
  <line x1="610" y1="148" x2="646" y2="148" stroke="#55e6a0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="628" y="140" font-size="10" fill="#55e6a0" text-anchor="middle">:8083 sensitive</text>

  <!-- arrow: sandbox -> praxis (third entry, egress-restricted) -->
  <polyline points="290,258 620,258 620,170 646,170" fill="none" stroke="#9db1c8" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
  <text x="628" y="184" font-size="10" fill="#9db1c8" text-anchor="middle">:80 only</text>
  <text x="455" y="250" font-size="11" fill="#9db1c8" text-anchor="middle">sandbox egress: praxis only — everything else denied</text>

  <!-- praxis -> judgment entries (stage-aware, part of praxis) -->
  <line x1="950" y1="148" x2="986" y2="148" stroke="#9db1c8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="968" y="140" font-size="10" fill="#9db1c8" text-anchor="middle">stage</text>

  <!-- praxis -> cpu pool -->
  <polyline points="680,196 680,335 220,335 220,386" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="327" font-size="11" fill="#9db1c8" text-anchor="middle">CPU-first pin — batch volume</text>

  <!-- praxis -> cpu pool, sensitive (enters the approved set) -->
  <polyline points="668,196 668,343 210,343 210,386" fill="none" stroke="#55e6a0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="440" y="357" font-size="11" fill="#55e6a0" text-anchor="middle">SENSITIVE (CPU pin)</text>

  <!-- praxis -> approved pool (sensitive judgment + sensitive failover, green) -->
  <polyline points="770,196 770,365 590,365 590,386" fill="none" stroke="#55e6a0" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="680" y="388" font-size="11" fill="#55e6a0" text-anchor="middle">SENSITIVE JUDGMENT — fail-closed</text>

  <!-- praxis -> gpu pools -->
  <polyline points="860,196 860,335 960,335 960,386" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="910" y="327" font-size="11" fill="#9db1c8" text-anchor="middle">JUDGMENT (risk + report)</text>

  <!-- node configuration for the OpenShift measurement runs -->
  <rect x="40" y="540" width="1200" height="94" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="56" y="560" font-size="11" font-weight="600" fill="#e9f2ff">DEMO TARGET — ROSA HCP, one AZ: x8i.24xlarge CPU node + g5.12xlarge GPU node</text>
  <text x="56" y="578" font-size="10" fill="#9db1c8">x8i: 48 physical cores · 2 NUMA nodes × 24 · AMX bf16/int8 · thread-0 CPUs 0–47 · SMT siblings (i+48) left to the OS.</text>
  <text x="56" y="596" font-size="10" fill="#9db1c8">OMP bind (measured): MoE 0–15 (NUMA 0) · specialist 16–17 · 1.5B 24–35 (NUMA 1) · free 18–23 and 36–47. No static CPU manager / PerformanceProfile.</text>
  <text x="56" y="614" font-size="10" fill="#9db1c8">g5: 4× A10G, TP=4. Pools are tainted; per-node gp3 caches seeded offline (HF_HUB_OFFLINE=1) before the pools start. SNO numbers are historical.</text>

  <!-- footer -->
  <text x="40" y="652" font-size="11" fill="#9db1c8">Configs are routing policies over the same pools: all-gpu · gpu-small · round-robin · hybrid (0 sensitive violations, measured). Sensitivity is a constraint; batch is CPU-first. PPE authenticates every step.</text>
</svg>
