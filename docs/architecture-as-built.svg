<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">As-built architecture — clients, recorders, policy gate and pools</title>
  <desc id="d">Four layers. Clients: the review pipeline and the OpenShell sandbox. The pipeline sends each request to a trace-ui ingress relay; the sandbox may reach only praxis, enforced by its egress policy. Record and decide: trace-ui holds four ingress doors (general, sensitive, judgment, sensitive-judgment) and writes an audit row for every request, while praxis authenticates each step's API key, records the request, runs an observe-only PII scan, and uses the active routing config to pick a pool. Pool relays: one trace-ui relay per pool records the model call and its timing; praxis never calls a pool directly. Pools: vllm-cpu and vllm-gpu-approved sit inside the approved set where sensitive data may run; vllm-gpu and vllm-gpu-small are the general pools. The gateway audit trail, not a log line, is the evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9db1c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55e6a0"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8298"/>
    </marker>
  </defs>

  <rect width="1280" height="830" fill="#07111f"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#e9f2ff">As-built architecture — clients, recorders, policy gate and pools</text>
  <text x="40" y="68" font-size="12" fill="#9db1c8">every request is recorded and authenticated · the gateway database is the audit trail · gateway image v0.9.1 · demo target: ROSA HCP</text>

  <!-- layer 1: clients -->
  <text x="40" y="96" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5">CLIENTS · WHERE A REQUEST STARTS</text>

  <rect x="40" y="108" width="560" height="104" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="320" y="134" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">REVIEW PIPELINE</text>
  <text x="320" y="158" font-size="11" fill="#9db1c8" text-anchor="middle">CUAD batch + synthetic contracts</text>
  <text x="320" y="178" font-size="11" fill="#9db1c8" text-anchor="middle">PII screen picks the entry · per-step API key</text>
  <text x="320" y="198" font-size="9.5" fill="#6f8298" text-anchor="middle">also: the MCP facade, which reaches the ingress only</text>

  <rect x="620" y="108" width="560" height="104" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="900" y="134" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">OPENSHELL SANDBOX</text>
  <text x="900" y="158" font-size="11" fill="#9db1c8" text-anchor="middle">OpenClaw agent · Landlock + NetworkPolicy</text>
  <text x="900" y="178" font-size="11" fill="#9db1c8" text-anchor="middle">egress allows praxis only; everything else denied</text>
  <text x="900" y="198" font-size="9.5" fill="#6f8298" text-anchor="middle">no pool access, no direct model access</text>

  <line x1="480" y1="214" x2="480" y2="254" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="900" y1="214" x2="900" y2="254" stroke="#6f8298" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <text x="912" y="238" font-size="9.5" fill="#6f8298">egress: praxis only</text>

  <!-- layer 2: record + decide -->
  <text x="40" y="248" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5">RECORD + DECIDE · TRACE-UI AND PRAXIS</text>

  <rect x="40" y="258" width="520" height="180" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="60" y="284" font-size="14" font-weight="600" fill="#e9f2ff">TRACE-UI · RECORDERS</text>
  <text x="60" y="310" font-size="10.5" fill="#c9d8ea">four ingress doors: general · sensitive ·</text>
  <text x="60" y="328" font-size="10.5" fill="#c9d8ea">judgment · sensitive-judgment</text>
  <text x="60" y="350" font-size="10.5" fill="#c9d8ea">writes a request row, then forwards to praxis</text>
  <text x="60" y="372" font-size="10.5" fill="#c9d8ea">SQLite on a PVC · waterfall UI · audit.jsonl</text>
  <text x="60" y="400" font-size="9.5" fill="#6f8298">the audit trail is the evidence, not a log line</text>
  <text x="60" y="420" font-size="9.5" fill="#6f8298">pool relays are below — same product, second role</text>

  <line x1="562" y1="348" x2="616" y2="348" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="589" y="340" font-size="9.5" fill="#9db1c8" text-anchor="middle">forwards</text>

  <rect x="620" y="258" width="560" height="180" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="640" y="284" font-size="14" font-weight="600" fill="#e9f2ff">PRAXIS · POLICY + ROUTING</text>
  <text x="640" y="310" font-size="10.5" fill="#c9d8ea">PPE: per-step API key; an unknown key fails closed</text>
  <text x="640" y="332" font-size="10.5" fill="#c9d8ea">audit record for every request</text>
  <text x="640" y="354" font-size="10.5" fill="#c9d8ea">shadow PII scan — observe-only, never routes</text>
  <text x="640" y="376" font-size="10.5" fill="#c9d8ea">active config maps entry + step → pool</text>
  <text x="640" y="398" font-size="10.5" fill="#c9d8ea">hybrid: risk/report use GPU judgment entries</text>
  <text x="640" y="420" font-size="9.5" fill="#6f8298">sensitive entries may only use approved pools</text>

  <!-- layer 3: pool relays -->
  <text x="40" y="466" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5">POOL RELAYS · ONE PER POOL</text>

  <rect x="40" y="476" width="1140" height="86" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="60" y="502" font-size="14" font-weight="600" fill="#e9f2ff">TRACE-UI · MODEL-CALL RECORDERS</text>
  <text x="60" y="526" font-size="10.5" fill="#c9d8ea">writes the model-call row — route, timing and device time — then forwards to the pool it names</text>
  <text x="60" y="548" font-size="10" fill="#6f8298">:8081 / :8082 / :8084 / :8085 — praxis only talks to these, never to a pool directly</text>

  <path d="M 900 440 L 900 472" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- layer 4: pools -->
  <path d="M 610 564 L 610 586 L 177 586 L 177 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 422 586 L 422 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 610 586 L 765 586 L 765 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1032 586 L 1032 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="625" y="581" font-size="9.5" fill="#6f8298">the active config picks one pool</text>

  <!-- approved set -->
  <rect x="40" y="596" width="520" height="180" rx="10" fill="#0a1f18" fill-opacity="0.45" stroke="#55e6a0" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="60" y="632" width="235" height="112" rx="8" fill="#0d1b2d" stroke="#55e6a0" stroke-width="1.2"/>
  <text x="177" y="658" font-size="12" font-weight="700" fill="#e9f2ff" text-anchor="middle">vllm-cpu</text>
  <text x="177" y="680" font-size="10" fill="#c9d8ea" text-anchor="middle">CUAD specialist + vLLM</text>
  <text x="177" y="698" font-size="10" fill="#c9d8ea" text-anchor="middle">x8i.24xlarge · 48 cores</text>
  <text x="177" y="724" font-size="9.5" fill="#6f8298" text-anchor="middle">composite: extraction stays here</text>

  <rect x="305" y="632" width="235" height="112" rx="8" fill="#0d1b2d" stroke="#55e6a0" stroke-width="1.2"/>
  <text x="422" y="658" font-size="12" font-weight="700" fill="#e9f2ff" text-anchor="middle">vllm-gpu-approved</text>
  <text x="422" y="680" font-size="10" fill="#c9d8ea" text-anchor="middle">4× A10G · TP=4</text>
  <text x="422" y="698" font-size="10" fill="#c9d8ea" text-anchor="middle">sensitive-only pin</text>
  <text x="422" y="724" font-size="9.5" fill="#6f8298" text-anchor="middle">fails closed if it is down</text>

  <text x="300" y="768" font-size="10" font-weight="700" fill="#55e6a0" text-anchor="middle">APPROVED SET — sensitive data may run only here</text>

  <!-- general pools -->
  <rect x="620" y="596" width="560" height="180" rx="10" fill="none" stroke="#2b4865" stroke-width="1.2" stroke-dasharray="6 4"/>

  <rect x="640" y="632" width="250" height="112" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.2"/>
  <text x="765" y="658" font-size="12" font-weight="700" fill="#e9f2ff" text-anchor="middle">vllm-gpu</text>
  <text x="765" y="680" font-size="10" fill="#c9d8ea" text-anchor="middle">4× A10G · TP=4</text>
  <text x="765" y="698" font-size="10" fill="#c9d8ea" text-anchor="middle">Qwen3.5-35B-A3B</text>
  <text x="765" y="724" font-size="9.5" fill="#6f8298" text-anchor="middle">general + judgment work</text>

  <rect x="905" y="632" width="255" height="112" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.2"/>
  <text x="1032" y="658" font-size="12" font-weight="700" fill="#e9f2ff" text-anchor="middle">vllm-gpu-small</text>
  <text x="1032" y="680" font-size="10" fill="#c9d8ea" text-anchor="middle">Qwen2.5-1.5B</text>
  <text x="1032" y="698" font-size="10" fill="#c9d8ea" text-anchor="middle">served on CPU on ROSA</text>
  <text x="1032" y="724" font-size="9.5" fill="#6f8298" text-anchor="middle">a route name, not a GPU</text>

  <text x="900" y="768" font-size="10" font-weight="700" fill="#9db1c8" text-anchor="middle">GENERAL POOLS — never receive sensitive data</text>

  <text x="40" y="806" font-size="11" fill="#6f8298">Route names are policies, not hardware: vllm-gpu-small is CPU-served, and vllm-cpu is a composite that holds the CUAD specialist. Read the pool map before quoting a device.</text>
</svg>
