<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">As-built architecture — clients, recorders, policy gate and pools</title>
  <desc id="d">Four layers. Clients: the review pipeline and the OpenShell sandbox. The pipeline sends each request to one of two trace-ui ingress relays, general or sensitive, chosen only by the PII screen; the sandbox may reach only praxis, enforced by its egress policy. Record and decide: trace-ui records the entry and forwards to praxis, while praxis authenticates each step's API key, records the request, runs an observe-only PII scan, and matches the declarative X-Demo-Step header against the work-to-pool table to pick a pool: CUAD clause extraction goes to cuad-specialist, classify and data protection to vllm-cpu, and risk/report to vllm-gpu (general) or vllm-gpu-approved (sensitive). Pool relays: one trace-ui relay per pool records the model call and its timing; praxis never calls a pool directly. Pools: cuad-specialist, vllm-cpu and vllm-gpu-approved sit inside the approved set where sensitive data may run; vllm-gpu and vllm-gpu-small are the general pools. The gateway audit trail, not a log line, is the evidence. A fifth, control-plane path (opt-in, not part of the recorded run) is the pre-entry PII screen: trace-ui screen ingress 8086 to the Praxis screen listener, then the jev-cpu relay 8089 to the CPU Jev pool; it is not a review entry and has no failover.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9db1c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55e6a0"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8298"/>
    </marker>
  </defs>

  <rect width="1280" height="860" fill="#07111f"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#e9f2ff">As-built architecture — clients, recorders, policy gate and pools</text>
  <text x="40" y="68" font-size="12" fill="#9db1c8">every request is recorded and authenticated · the gateway database is the audit trail · gateway image v0.9.1 · demo target: ROSA HCP</text>

  <!-- layer 1: clients -->
  <text x="40" y="96" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5">CLIENTS · WHERE A REQUEST STARTS</text>

  <rect x="40" y="108" width="560" height="104" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="320" y="134" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">REVIEW PIPELINE</text>
  <text x="320" y="158" font-size="11" fill="#9db1c8" text-anchor="middle">CUAD batch + synthetic contracts</text>
  <text x="320" y="178" font-size="11" fill="#9db1c8" text-anchor="middle">PII screen picks the entry · per-step API key</text>
  <text x="320" y="198" font-size="9.5" fill="#6f8298" text-anchor="middle">also: the MCP facade, which reaches the ingress only</text>

  <rect x="620" y="108" width="560" height="104" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="900" y="134" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">OPENSHELL SANDBOX</text>
  <text x="900" y="158" font-size="11" fill="#9db1c8" text-anchor="middle">OpenClaw agent · Landlock + NetworkPolicy</text>
  <text x="900" y="178" font-size="11" fill="#9db1c8" text-anchor="middle">egress allows praxis only; everything else denied</text>
  <text x="900" y="198" font-size="9.5" fill="#6f8298" text-anchor="middle">no pool access, no direct model access</text>

  <line x1="480" y1="214" x2="480" y2="254" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="900" y1="214" x2="900" y2="254" stroke="#6f8298" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <text x="912" y="238" font-size="9.5" fill="#6f8298">egress: praxis only</text>

  <!-- layer 2: record + decide -->
  <text x="40" y="248" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5">RECORD + DECIDE · TRACE-UI AND PRAXIS</text>

  <rect x="40" y="258" width="520" height="180" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="60" y="284" font-size="14" font-weight="600" fill="#e9f2ff">TRACE-UI · RECORDERS</text>
  <text x="60" y="310" font-size="10.5" fill="#c9d8ea">two ingress doors: general · sensitive</text>
  <text x="60" y="328" font-size="10.5" fill="#c9d8ea">the PII screen picks the door; both record</text>
  <text x="60" y="350" font-size="10.5" fill="#c9d8ea">writes a request row, then forwards to praxis</text>
  <text x="60" y="372" font-size="10.5" fill="#c9d8ea">SQLite on a PVC · waterfall UI · audit.jsonl</text>
  <text x="60" y="400" font-size="9.5" fill="#6f8298">the audit trail is the evidence, not a log line</text>
  <text x="60" y="420" font-size="9.5" fill="#6f8298">pool relays are below — same product, second role</text>

  <line x1="562" y1="348" x2="616" y2="348" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="589" y="340" font-size="9.5" fill="#9db1c8" text-anchor="middle">forwards</text>

  <rect x="620" y="258" width="560" height="180" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="640" y="284" font-size="14" font-weight="600" fill="#e9f2ff">PRAXIS · POLICY + ROUTING</text>
  <text x="640" y="310" font-size="10.5" fill="#c9d8ea">PPE: per-step API key; an unknown key fails closed</text>
  <text x="640" y="332" font-size="10.5" fill="#c9d8ea">audit record for every request</text>
  <text x="640" y="354" font-size="10.5" fill="#c9d8ea">shadow PII scan — observe-only, never routes</text>
  <text x="640" y="376" font-size="10.5" fill="#c9d8ea">router matches X-Demo-Step → work-to-pool table</text>
  <text x="640" y="398" font-size="10.5" fill="#c9d8ea">hybrid: CUAD clauses → cuad-specialist</text>
  <text x="640" y="418" font-size="9.5" fill="#c9d8ea">classify/data protection → vllm-cpu · risk/report → GPU · sensitive: approved pools only</text>

  <!-- layer 3: pool relays -->
  <text x="40" y="466" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5">POOL RELAYS · ONE PER POOL</text>

  <rect x="40" y="476" width="1140" height="86" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="60" y="502" font-size="14" font-weight="600" fill="#e9f2ff">TRACE-UI · MODEL-CALL RECORDERS</text>
  <text x="60" y="526" font-size="10.5" fill="#c9d8ea">writes the model-call row — route, timing and device time — then forwards to the pool it names</text>
  <text x="60" y="548" font-size="10" fill="#6f8298">:8088 / :8081 / :8082 / :8084 / :8085 — praxis only talks to these, never to a pool directly</text>

  <path d="M 900 440 L 900 472" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- layer 4: pools -->
  <path d="M 610 564 L 610 586 L 152 586 L 152 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 610 564 L 610 586 L 352 586 L 352 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 610 564 L 610 586 L 562 586 L 562 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 610 564 L 610 586 L 845 586 L 845 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 610 564 L 610 586 L 1080 586 L 1080 628" fill="none" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="625" y="581" font-size="9.5" fill="#6f8298">the step table picks one pool</text>

  <!-- approved set -->
  <rect x="40" y="596" width="650" height="180" rx="10" fill="#0a1f18" fill-opacity="0.45" stroke="#55e6a0" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="60" y="632" width="185" height="112" rx="8" fill="#0d1b2d" stroke="#55e6a0" stroke-width="1.2"/>
  <text x="152" y="656" font-size="11.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">cuad-specialist</text>
  <text x="152" y="678" font-size="10" fill="#c9d8ea" text-anchor="middle">RoBERTa-large QA</text>
  <text x="152" y="696" font-size="10" fill="#c9d8ea" text-anchor="middle">CPU · 2 cores</text>
  <text x="152" y="722" font-size="9" fill="#6f8298" text-anchor="middle">CUAD clauses · extract only</text>

  <rect x="260" y="632" width="185" height="112" rx="8" fill="#0d1b2d" stroke="#55e6a0" stroke-width="1.2"/>
  <text x="352" y="656" font-size="11.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">vllm-cpu</text>
  <text x="352" y="678" font-size="10" fill="#c9d8ea" text-anchor="middle">Qwen3.5-35B-A3B</text>
  <text x="352" y="696" font-size="10" fill="#c9d8ea" text-anchor="middle">CPU MoE · x8i.24xlarge</text>
  <text x="352" y="722" font-size="9" fill="#6f8298" text-anchor="middle">classify + data protection</text>

  <rect x="460" y="632" width="205" height="112" rx="8" fill="#0d1b2d" stroke="#55e6a0" stroke-width="1.2"/>
  <text x="562" y="656" font-size="11.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">vllm-gpu-approved</text>
  <text x="562" y="678" font-size="10" fill="#c9d8ea" text-anchor="middle">4× A10G · TP=4</text>
  <text x="562" y="696" font-size="10" fill="#c9d8ea" text-anchor="middle">sensitive risk + report</text>
  <text x="562" y="722" font-size="9" fill="#6f8298" text-anchor="middle">fails closed if it is down</text>

  <text x="365" y="768" font-size="10" font-weight="700" fill="#55e6a0" text-anchor="middle">APPROVED SET — sensitive data may run only here</text>

  <!-- general pools -->
  <rect x="710" y="596" width="490" height="180" rx="10" fill="none" stroke="#2b4865" stroke-width="1.2" stroke-dasharray="6 4"/>

  <rect x="730" y="632" width="225" height="112" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.2"/>
  <text x="842" y="656" font-size="11.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">vllm-gpu</text>
  <text x="842" y="678" font-size="10" fill="#c9d8ea" text-anchor="middle">4× A10G · TP=4</text>
  <text x="842" y="696" font-size="10" fill="#c9d8ea" text-anchor="middle">Qwen3.5-35B-A3B</text>
  <text x="842" y="722" font-size="9" fill="#6f8298" text-anchor="middle">general risk + report</text>

  <rect x="975" y="632" width="205" height="112" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.2"/>
  <text x="1077" y="656" font-size="11.5" font-weight="700" fill="#e9f2ff" text-anchor="middle">vllm-gpu-small</text>
  <text x="1077" y="678" font-size="10" fill="#c9d8ea" text-anchor="middle">Qwen2.5-1.5B</text>
  <text x="1077" y="696" font-size="10" fill="#c9d8ea" text-anchor="middle">served on CPU on ROSA</text>
  <text x="1077" y="722" font-size="9" fill="#6f8298" text-anchor="middle">a route name, not a GPU</text>

  <text x="955" y="768" font-size="10" font-weight="700" fill="#9db1c8" text-anchor="middle">GENERAL POOLS — never receive sensitive data</text>

  <text x="40" y="806" font-size="11" fill="#6f8298">Route names are policies, not hardware: vllm-gpu-small is CPU-served, and vllm-cpu is a plain CPU MoE endpoint; the CUAD specialist is its own route. Read the pool map before quoting a device.</text>
  <text x="40" y="828" font-size="10.5" fill="#6f8298">Control plane (opt-in, not in this run): screen:pii → trace-ui :8086 → Praxis :8086 → trace-ui :8089 → jev-cpu. The measured screen stays regex; the opt-in Jev cause trigger failed its 0.714 F1 guardrail.</text>
</svg>
