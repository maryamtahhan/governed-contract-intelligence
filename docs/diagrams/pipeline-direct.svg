<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Direct run — one endpoint, no routing, no audit</title>
  <desc id="d">Two stages. The client stage is the batch runner on CPU: it reads documents, builds prompts, sends HTTP, parses JSON and scores records, but never runs a model. The inference stage is one vLLM endpoint for the whole run, serving one model on either CPU or GPU. Every stage call (classify, four extractions, risk, and the one report at the end) goes to that endpoint over plain HTTP. There is no relay, gateway, label routing, pool choice or trace, so a direct run measures model quality only. Classify here is the pipeline's own document-classification prompt, not the gateway classifier removed in 2026-11-05.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9db1c8"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8298"/>
    </marker>
  </defs>

  <rect width="1280" height="570" fill="#07111f"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#e9f2ff">Direct run — one endpoint, no routing, no audit</text>
  <text x="40" y="68" font-size="12" fill="#9db1c8">the runner builds prompts and scores; one endpoint runs every model call</text>

  <!-- client stage -->
  <rect x="40" y="100" width="420" height="300" rx="10" fill="#0a1626" stroke="#2b4865" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="250" y="124" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5" text-anchor="middle">CLIENT · CPU · ORCHESTRATION ONLY</text>

  <rect x="60" y="140" width="380" height="104" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="250" y="166" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">BATCH RUNNER</text>
  <text x="250" y="186" font-size="10.5" fill="#9db1c8" text-anchor="middle">hybrid-run --target direct</text>
  <text x="250" y="208" font-size="10.5" fill="#c9d8ea" text-anchor="middle">builds prompts · sends HTTP</text>
  <text x="250" y="226" font-size="10.5" fill="#c9d8ea" text-anchor="middle">parses JSON · scores · never runs the model</text>

  <rect x="60" y="268" width="380" height="112" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="250" y="292" font-size="11" font-weight="600" fill="#c9d8ea" text-anchor="middle">STAGE CALLS · one HTTP POST each</text>

  <rect x="69" y="306" width="84" height="28" rx="14" fill="#10253a" stroke="#3d648a" stroke-width="1"/>
  <text x="111" y="324" font-size="11" fill="#dce9f7" text-anchor="middle">classify</text>
  <rect x="163" y="306" width="104" height="28" rx="14" fill="#10253a" stroke="#3d648a" stroke-width="1"/>
  <text x="215" y="324" font-size="11" fill="#dce9f7" text-anchor="middle">extract ×4</text>
  <rect x="277" y="306" width="60" height="28" rx="14" fill="#10253a" stroke="#3d648a" stroke-width="1"/>
  <text x="307" y="324" font-size="11" fill="#dce9f7" text-anchor="middle">risk</text>
  <rect x="347" y="306" width="84" height="28" rx="14" fill="#10253a" stroke="#3d648a" stroke-width="1"/>
  <text x="389" y="324" font-size="11" fill="#dce9f7" text-anchor="middle">report ×1</text>

  <text x="250" y="354" font-size="10" fill="#9db1c8" text-anchor="middle">classify, extract and risk run per document</text>
  <text x="250" y="370" font-size="10" fill="#6f8298" text-anchor="middle">the one report call runs once at the end</text>

  <!-- handoff -->
  <line x1="464" y1="236" x2="532" y2="236" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="498" y="228" font-size="9.5" fill="#9db1c8" text-anchor="middle">POST</text>
  <line x1="532" y1="258" x2="464" y2="258" stroke="#6f8298" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <text x="498" y="276" font-size="9.5" fill="#6f8298" text-anchor="middle">answer</text>

  <!-- inference stage -->
  <rect x="540" y="100" width="700" height="300" rx="10" fill="#0a1626" stroke="#2b4865" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="890" y="124" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7fb2e5" text-anchor="middle">INFERENCE · ONE ENDPOINT PER RUN · CPU OR GPU, NEVER A MIX</text>

  <rect x="560" y="140" width="310" height="124" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="715" y="166" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">VLLM ENDPOINT</text>
  <text x="715" y="188" font-size="10.5" fill="#9db1c8" text-anchor="middle">/v1/chat/completions</text>
  <text x="715" y="208" font-size="10.5" fill="#9db1c8" text-anchor="middle">OpenAI-compatible</text>
  <text x="715" y="228" font-size="10.5" fill="#9db1c8" text-anchor="middle">no relay · no gateway · no trace</text>

  <line x1="874" y1="202" x2="896" y2="202" stroke="#9db1c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="900" y="140" width="320" height="124" rx="8" fill="#0d1b2d" stroke="#2b4865" stroke-width="1.5"/>
  <text x="1060" y="166" font-size="14" font-weight="600" fill="#e9f2ff" text-anchor="middle">SERVED MODEL</text>
  <text x="1060" y="188" font-size="10.5" fill="#9db1c8" text-anchor="middle">Qwen3.5-35B-A3B</text>
  <text x="1060" y="208" font-size="10.5" fill="#9db1c8" text-anchor="middle">alias Semantic-Qwen</text>
  <text x="1060" y="228" font-size="10.5" fill="#9db1c8" text-anchor="middle">4× A10G · or CPU x8i.24xlarge</text>

  <rect x="560" y="286" width="660" height="94" rx="8" fill="#10253a" stroke="#2b4865" stroke-width="1"/>
  <text x="580" y="310" font-size="12" font-weight="600" fill="#e9f2ff">Every stage call runs here</text>
  <text x="580" y="332" font-size="10.5" fill="#9db1c8">classify · extract ×4 · risk · the one report — same endpoint, same model</text>
  <text x="580" y="352" font-size="10.5" fill="#9db1c8">No per-stage choice: the whole run is CPU-served or GPU-served.</text>

  <!-- notes -->
  <text x="40" y="438" font-size="11" fill="#9db1c8">The batch runner is CPU-side orchestration: prompt construction, HTTP fan-out, JSON parsing and scoring. It never runs the model.</text>
  <text x="40" y="460" font-size="11" fill="#9db1c8">Stage ownership is flat: every model call goes to the one endpoint. Nothing routes, labels, spills or records a trace.</text>

  <rect x="40" y="484" width="262" height="34" rx="8" fill="#0b2a1e" stroke="#1f7a52" stroke-width="1"/>
  <text x="58" y="506" font-size="12" font-weight="600" fill="#55e6a0">Proves: model quality</text>

  <rect x="318" y="484" width="430" height="34" rx="8" fill="#2a1518" stroke="#7a2c31" stroke-width="1"/>
  <text x="336" y="506" font-size="12" font-weight="600" fill="#ff8f8f">Does not prove: routing · containment · audit</text>

  <text x="40" y="546" font-size="10.5" fill="#6f8298">direct.py reuses review.py's prompt builders, parser, ground truth and scorer — only the transport differs. "classify" here is the pipeline's document-classification prompt; the gateway classifier was removed (FINDINGS §15.5).</text>
</svg>
