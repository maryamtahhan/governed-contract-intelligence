/* ---------- live: one streamed run, shared by both entry points ---------- */
// The server may have been started with --live-token. Ask for it once when a
// live request is first refused, then send it on every live request after.
let liveToken = sessionStorage.getItem("liveToken");

async function livePost(url, payload) {
  const headers = { "content-type": "application/json" };
  if (liveToken) headers["x-live-token"] = liveToken;
  let res = await fetch(url, { method: "POST", headers, body: JSON.stringify(payload) });
  if (res.status === 401) {
    const entered = prompt("This stage UI asks for a live token (--live-token).");
    if (entered) {
      liveToken = entered;
      sessionStorage.setItem("liveToken", entered);
      headers["x-live-token"] = entered;
      res = await fetch(url, { method: "POST", headers, body: JSON.stringify(payload) });
    }
  }
  return res;
}

async function streamLive(payload, onStage) {
  const res = await livePost("/api/live/stream", payload);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "", done = null;
  for (;;) {
    const { value, done: eof } = await reader.read();
    if (eof) break;
    buf += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      const line = block.split("\n").find((l) => l.startsWith("data: "));
      if (!line) continue;
      const ev = JSON.parse(line.slice(6));
      if (ev.type === "stage") onStage(ev.record);
      else if (ev.type === "done") done = ev;
      else if (ev.type === "error") throw new Error(ev.detail);
    }
  }
  if (!done) throw new Error("the stream ended without a result");
  return done;
}

// Same wire protocol, one queue of events per corpus document.
async function streamCorpus(payload, onEvent) {
  const res = await livePost("/api/corpus/stream", payload);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "", done = null;
  for (;;) {
    const { value, done: eof } = await reader.read();
    if (eof) break;
    buf += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, cut);
      buf = buf.slice(cut + 2);
      const line = block.split("\n").find((l) => l.startsWith("data: "));
      if (!line) continue;
      const ev = JSON.parse(line.slice(6));
      if (ev.type === "done") done = ev;
      else onEvent(ev);
    }
  }
  if (!done) throw new Error("the stream ended without a result");
  return done;
}

async function submitCorpus() {
  if (S.busy || !S.pending) return;
  const pending = S.pending;
  const payload = pending.kind === "archive"
    ? { archive: { name: pending.name, data: pending.data } }
    : { files: pending.files };
  S.pending = null;
  S.busy = true;
  S.corpus = { rows: [], done: 0, errors: 0, running: true,
               startedAt: performance.now(), skipped: [] };
  S.current = NEW_DOC;
  renderRail();
  renderCorpus();
  const rowFor = (docId) => S.corpus?.rows.find((r) => r.doc_id === docId);

  try {
    await streamCorpus(payload, (ev) => {
      if (ev.type === "corpus_start") {
        S.corpus.rows = ev.docs.map((d) => ({
          doc_id: d.doc_id, name: d.name, status: "", label: "queued" }));
        S.corpus.skipped = ev.skipped || [];
        renderCorpus();
      } else if (ev.type === "doc_start") {
        const row = rowFor(ev.doc_id);
        if (row) { row.label = "running…"; }
        renderCorpus();
      } else if (ev.type === "stage") {
        const row = rowFor(ev.doc_id);
        if (row) {
          row.label = `${ev.record.step} · ${ms(ev.record.latency_ms)}`;
        }
        renderCorpus();
      } else if (ev.type === "doc_done") {
        const row = rowFor(ev.doc_id);
        S.live[ev.doc_id] = ev.document;
        if (row) { row.status = "done"; row.label = "done — open"; }
        S.corpus.done += 1;
        renderRail();
        renderCorpus();
      } else if (ev.type === "doc_error") {
        const row = rowFor(ev.doc_id);
        if (row) { row.status = "err"; row.label = ev.detail.slice(0, 80); }
        S.corpus.errors += 1;
        renderCorpus();
      }
    });
  } catch (err) {
    S.corpus.running = false;
    S.corpus.errors += 1;
    renderCorpus();
    const status = $("#liveStatus");
    if (status) { status.className = "err"; status.textContent = `corpus run failed: ${err.message}`; }
    S.busy = false;
    return;
  }
  S.corpus.running = false;
  S.busy = false;
  renderRail();
  renderCorpus();
  const status = $("#liveStatus");
  if (status) {
    status.className = S.corpus.errors ? "err" : "ok";
    status.textContent = `${S.corpus.done} of ${S.corpus.rows.length} documents ran`
      + (S.corpus.errors ? ` · ${S.corpus.errors} failed` : "")
      + " — unscored, since a submitted corpus has no annotations";
  }
}

function markNode(key, cls) {
  const node = $(`#main .pipe .node[data-node="${key}"]`);
  if (!node) return;
  node.classList.remove("off", "active", "done");
  node.classList.add(cls);
}

function nodeText(key, text) {
  const t = $(`#main .pipe .node[data-node="${key}"] .t`);
  if (t) t.textContent = text;
}

// Lights each strip node as its stage actually lands, and keeps a running
// message of what just came back. Shared by "Run live" and the composer.
function stageWatcher(total, status, t0) {
  let seen = 0;
  let extractMs = 0;
  const start = () => {
    markNode("classify", "active");
    markNode("extract", "active");
    markNode("risk", "off");
  };
  const onStage = (rec) => {
    const label = rec.step.startsWith("extract:")
      ? `extract:${rec.step.split(":")[1]}` : rec.step;
    if (rec.step.startsWith("extract:")) {
      seen += 1;
      extractMs += rec.latency_ms || 0;
      nodeText("extract", `${seen}/${total} back · ${ms(extractMs)} so far`);
      if (seen >= total) {
        markNode("extract", "done");
        markNode("risk", "active");
      }
    } else {
      markNode(rec.step, rec.outcome === "served" ? "done" : "off");
      nodeText(rec.step, rec.outcome === "served"
        ? `${ms(rec.latency_ms)} · served`
        : `${esc(rec.outcome)}`);
    }
    if (status) {
      status.className = "";
      status.textContent = `${label} ${rec.outcome === "served" ? "landed" : "failed"} in `
        + `${ms(rec.latency_ms)} · ${((performance.now() - t0) / 1000).toFixed(1)}s elapsed`;
    }
  };
  return { start, onStage };
}

async function submitDocument() {
  if (S.busy) return;
  if (S.pending) { await submitCorpus(); return; }
  const status = $("#liveStatus");
  S.draft = $("#composerText")?.value ?? S.draft;
  if (!S.draft.trim()) {
    status.className = "err";
    status.textContent = "Paste some contract text, or open a .txt / .md file, first.";
    return;
  }
  const t0 = performance.now();
  S.busy = true;
  const btn = $("#submitBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span> Running`;
  const total = (S.data.clause_keys || []).length;
  const watcher = stageWatcher(total, status, t0);
  watcher.start();
  status.className = "";
  status.textContent = `classify + ${total} extracts in flight…`;

  try {
    const body = await streamLive(
      { text: S.draft, name: S.draftName || "pasted" }, watcher.onStage);
    S.live[body.doc_id] = body.document;
    S.current = body.doc_id;
    S.draft = "";
    S.draftName = null;
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    renderAll();
    pollEndpoint();
    const again = $("#liveStatus");
    again.className = "ok";
    again.textContent = `ran in ${secs}s — unscored, since the document has no annotations`;
  } catch (err) {
    status.className = "err";
    status.textContent = `live run failed: ${err.message}`;
  } finally {
    S.busy = false;
    if ($("#submitBtn")) {
      btn.disabled = false;
      btn.textContent = "Run through pipeline";
    }
  }
}

/* ---------- replay ---------- */
async function replay() {
  if (S.playing) return;
  const doc = currentDoc();
  if (!doc) return;
  S.playing = true;
  const btn = $("#replayBtn");
  btn.disabled = true;
  btn.textContent = "Replaying…";
  const cards = stageCards();
  const nodes = $$("#main .pipe .node[data-node]");
  // Reset the strip to "not yet run", then light each node as its stage lands.
  nodes.forEach((n) => {
    n.classList.remove("done", "active");
    n.classList.add("off");
  });
  cards.forEach((c) => c.classList.add("pending"));
  let model = 0;
  const clock = $("#clock");
  clock.innerHTML = `model time <b>0.0s</b>`;
  for (const card of cards) {
    const raw = Number(card.dataset.ms || 0);
    const node = card.dataset.node
      ? nodes.find((n) => n.dataset.node === card.dataset.node)
      : null;
    if (node) { node.classList.remove("off"); node.classList.add("active"); }
    await sleep(Math.max(140, Math.min(1300, raw * 0.09)));
    card.classList.remove("pending");
    if (node) { node.classList.remove("active"); node.classList.add("done"); }
    model += raw;
    clock.innerHTML = `model time <b>${(model / 1000).toFixed(1)}s</b>`;
    card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  S.playing = false;
  btn.disabled = false;
  btn.textContent = "Replay";
}

/* ---------- live ---------- */
async function runLive() {
  if (!S.data.live_enabled || S.busy) return;
  const docId = S.current;
  const status = $("#liveStatus");
  const t0 = performance.now();
  S.busy = true;
  const btn = $("#liveBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span> Running`;
  const total = (S.data.clause_keys || []).length;
  const watcher = stageWatcher(total, status, t0);
  watcher.start();
  status.className = "";
  status.textContent = `sending classify and ${total} extracts together…`;

  try {
    const body = await streamLive({ doc_id: docId }, watcher.onStage);
    S.live[docId] = body.document;
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    renderRail();
    renderMain();
    pollEndpoint();
    const again = $("#liveStatus");
    again.className = "ok";
    again.textContent = `live result for ${shortId(docId)} in ${secs}s — not part of the scored run`;
  } catch (err) {
    status.className = "err";
    status.textContent = `live run failed: ${err.message}`;
  } finally {
    S.busy = false;
    btn.disabled = false;
    btn.innerHTML = "Run live";
  }
}
</script>
</body>
