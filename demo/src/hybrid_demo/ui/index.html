<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage Review — contract pipeline</title>
<style>
:root {
  --bg: #f6f6f2;
  --panel: #ffffff;
  --panel-2: #fbfbf8;
  --ink: #191d1a;
  --muted: #5f665f;
  --faint: #8b928b;
  --line: #dcded6;
  --line-2: #e9eae4;
  --accent: #1c6b47;
  --accent-ink: #145236;
  --accent-soft: #e4efe8;
  --ok: #1c6b47;
  --ok-soft: #e4efe8;
  --bad: #a23329;
  --bad-soft: #f7e5e2;
  --warn: #8a5a12;
  --warn-soft: #f6edd9;
  --mark: #ffe58a;
  --mark-ink: #3d3005;
  --shadow: 0 1px 2px rgba(25, 29, 26, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1311;
    --panel: #171c19;
    --panel-2: #141816;
    --ink: #e7eae4;
    --muted: #9aa49b;
    --faint: #77817a;
    --line: #2a312c;
    --line-2: #212722;
    --accent: #66c99b;
    --accent-ink: #9adfba;
    --accent-soft: #1a2b22;
    --ok: #66c99b;
    --ok-soft: #1a2b22;
    --bad: #ef9186;
    --bad-soft: #2d1c1a;
    --warn: #e0b064;
    --warn-soft: #2b2317;
    --mark: #5c4a12;
    --mark-ink: #ffe9a3;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1311;
  --panel: #171c19;
  --panel-2: #141816;
  --ink: #e7eae4;
  --muted: #9aa49b;
  --faint: #77817a;
  --line: #2a312c;
  --line-2: #212722;
  --accent: #66c99b;
  --accent-ink: #9adfba;
  --accent-soft: #1a2b22;
  --ok: #66c99b;
  --ok-soft: #1a2b22;
  --bad: #ef9186;
  --bad-soft: #2d1c1a;
  --warn: #e0b064;
  --warn-soft: #2b2317;
  --mark: #5c4a12;
  --mark-ink: #ffe9a3;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
button { font: inherit; color: inherit; }

/* ---------- shell ---------- */
header.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font-size: 15px; letter-spacing: -.01em; font-weight: 650; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 9px; font-size: 11.5px; color: var(--muted);
  background: var(--panel-2); white-space: nowrap;
}
.chip b { color: var(--ink); font-weight: 600; }
.chip.live { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.dot.warn { background: var(--warn); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--panel-2);
  border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0c1712; font-weight: 600; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn.primary { color: #0c1712; font-weight: 600; }
}
.btn.ghost { background: transparent; }
a.btn { text-decoration: none; color: inherit; }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }

.shell {
  display: grid;
  grid-template-columns: 258px minmax(0, 1fr) 368px;
  grid-template-areas: "rail main side";
  flex: 1;
  min-height: 0;
}
.rail, .side { overflow-y: auto; min-height: 0; }
.rail { grid-area: rail; border-right: 1px solid var(--line); background: var(--panel-2); padding: 14px 10px 24px; }
.main { grid-area: main; overflow-y: auto; min-height: 0; padding: 20px 26px 64px; }
.side { grid-area: side; border-left: 1px solid var(--line); background: var(--panel-2); padding: 16px 16px 28px; }

/* ---------- rail ---------- */
.rail-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 0 6px 8px; color: var(--muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: .08em;
}
.doc-list { display: flex; flex-direction: column; gap: 2px; }
.doc-item {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto;
  align-items: center; gap: 8px;
  width: 100%; text-align: left; background: none; border: 1px solid transparent;
  border-radius: 7px; padding: 7px 8px; cursor: pointer;
}
.doc-item:hover { background: var(--panel); border-color: var(--line-2); }
.doc-item[aria-current="true"] { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
.doc-item .name { font-size: 11.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-item .flag { font-size: 10px; color: var(--faint); }
.doc-item .flag.full { color: var(--ok); }
.doc-item .flag.live { color: var(--accent-ink); }
.doc-item[aria-current="true"] .name { font-weight: 600; }

/* ---------- main ---------- */
.doc-head { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: flex-start; margin-bottom: 6px; }
.doc-head .idwrap { min-width: 0; flex: 1 1 340px; }
.doc-head h2 { margin: 0; font-size: 15px; font-weight: 600; word-break: break-all; line-height: 1.35; }
.doc-head .sub { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; color: var(--muted); font-size: 11.5px; align-items: center; }
.doc-head .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.doc-stats { display: flex; align-items: center; gap: 10px; margin: 12px 0 20px; flex-wrap: wrap; }
.meter {
  display: flex; gap: 3px; align-items: center;
}
.meter i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); display: block; }
.meter i.hit { background: var(--ok); }
.meter i.miss { background: var(--bad); }
.meter i.absent { background: var(--warn); }
.stamp {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  font-size: 11.5px; color: var(--muted);
}
.stamp.full { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }

.flow { display: flex; flex-direction: column; gap: 14px; position: relative; }
.stage {
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  box-shadow: var(--shadow); overflow: hidden;
}
.stage-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--line-2);
  background: var(--panel-2);
}
.stage-head .num {
  font: 600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--accent-ink); background: var(--accent-soft);
  border-radius: 4px; padding: 4px 5px; letter-spacing: .04em;
}
.stage-head h3 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: -.005em; }
.stage-head .dep { color: var(--faint); font-size: 11px; }
.stage-head .lat { margin-left: auto; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.stage-body { padding: 14px; }

.classify-row { display: flex; flex-wrap: wrap; gap: 22px; align-items: baseline; }
.pred { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.05; }
.pred.small { font-size: 20px; }
.kv { display: flex; flex-direction: column; gap: 1px; }
.kv .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
.kv .v { font-size: 12.5px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
  border-radius: 999px; padding: 2px 8px; white-space: nowrap;
}
.badge.ok { color: var(--ok); background: var(--ok-soft); }
.badge.bad { color: var(--bad); background: var(--bad-soft); }
.badge.warn { color: var(--warn); background: var(--warn-soft); }
.badge.neutral { color: var(--muted); background: var(--line-2); }

.extracts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; padding: 12px; }
.x-card {
  border: 1px solid var(--line-2); border-radius: 8px; padding: 11px 12px 10px;
  background: var(--panel); display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.x-card.v-bad { border-left: 3px solid var(--bad); }
.x-card.v-warn { border-left: 3px solid var(--warn); }
.x-card.v-ok { border-left: 3px solid var(--ok); }
.x-head { display: flex; align-items: center; gap: 8px; }
.x-head h4 { margin: 0; font-size: 12px; font-weight: 650; text-transform: capitalize; }
.x-head .lat { margin-left: auto; color: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; }
blockquote {
  margin: 0; padding: 8px 10px; border-left: 2px solid var(--line);
  background: var(--panel-2); border-radius: 0 6px 6px 0;
  font-size: 12.5px; line-height: 1.55; color: var(--ink);
  white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 190px; overflow-y: auto;
}
blockquote.empty { color: var(--faint); font-style: italic; }
.context {
  font-size: 11px; line-height: 1.5; color: var(--muted);
  overflow-wrap: anywhere; border-top: 1px dashed var(--line-2); padding-top: 7px;
}
.context mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.x-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--faint); font-size: 10.5px; align-items: center; }
.x-meta .ok { color: var(--ok); }
.x-meta .bad { color: var(--bad); }
.truth {
  margin-top: 2px; border-top: 1px solid var(--line-2); padding-top: 8px;
  font-size: 11.5px; color: var(--muted);
}
.truth .tlabel { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); margin-bottom: 3px; }
.truth .ttext { color: var(--ink); overflow-wrap: anywhere; }
.truth blockquote { font-size: 11.5px; max-height: 150px; }
body.hide-truth .truth-only { display: none !important; }
/* With truth off, nothing should still hint at correctness: neutralise the
   coloured card edges, the field meter and the rail's status dots. */
body.hide-truth .x-card { border-left-color: var(--line-2); }
body.hide-truth .doc-item .dot { background: var(--faint); }
body.hide-truth .doc-item .flag.full { display: none; }

.risk-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.risk-pill { font-size: 22px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.reasons { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); max-width: 640px; }
.reasons li { margin: 2px 0; }

/* ---------- side ---------- */
.side h2 {
  margin: 0 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--muted); font-weight: 650;
}
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); padding: 10px 11px; min-width: 0; }
.tile .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
.tile .val { font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 3px; line-height: 1.15; }
.tile .val small { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tile .sub { font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.bar { position: relative; height: 4px; border-radius: 2px; background: var(--line-2); margin-top: 7px; }
.bar span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
.bar i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.block { margin-top: 22px; }
.check-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.check { padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; border-bottom: 1px solid var(--line-2); }
.check:last-child { border-bottom: 0; }
.check-top { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; }
.check-top .ico { width: 14px; text-align: center; font-size: 11px; }
.check-top .ico.ok { color: var(--ok); }
.check-top .ico.bad { color: var(--bad); }
.check-top .val { margin-left: auto; font-size: 10.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.check .detail { font-size: 10.5px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.45; }
.counts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.count { border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-weight: 600; }
.count.bad b { color: var(--bad); }
.side .note { font-size: 10.5px; color: var(--faint); margin-top: 10px; line-height: 1.5; }
/* A plain-language key for the scoreboard's terms, collapsed by default so it
   does not add to the panel it explains. */
.side details.read {
  margin: 4px 0 12px; border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; background: var(--panel);
}
.side details.read summary { font-size: 10.5px; color: var(--muted); font-weight: 650; cursor: pointer; }
.side details.read p { font-size: 10.5px; color: var(--muted); margin: 7px 0 0; line-height: 1.5; }
.side details.read b { color: var(--ink); }
/* Secondary side-panel material folds away: the scoreboard and a one-line
   routing summary stay visible, the long lists and detail tables do not. */
.side details.fold { margin-top: 20px; border-top: 1px solid var(--line-2); padding-top: 12px; }
.side details.fold > summary {
  cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--muted); font-weight: 650; list-style: none; display: flex; align-items: center; gap: 6px;
}
.side details.fold > summary::-webkit-details-marker { display: none; }
.side details.fold > summary:before { content: "▸"; color: var(--faint); font-size: 10px; }
.side details.fold[open] > summary:before { content: "▾"; }
.side details.fold .fold-body { margin-top: 10px; }
.side .route-line { font-size: 11.5px; color: var(--muted); margin: 0 0 8px; line-height: 1.5; }
.side .route-line b { color: var(--ink); }
.chip.prov-example { border-color: var(--warn); color: var(--warn); }
.chip.prov-ok { border-color: var(--ok); color: var(--ok); }
details.how { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
.pipe + details.how { margin: -4px 0 16px; border-top: 0; padding-top: 0; }

/* request path: the run-level route from client to model */
.pathbar {
  display: flex; flex-wrap: wrap; align-items: center;
  padding: 8px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.pathbar .node { padding: 4px 8px; max-width: 100%; }
.pathbar .node .n, .pathbar .node .t { white-space: normal; }
.pathbar .parrow { color: var(--faint); padding: 0 7px; font-size: 12px; }
.pathbar .path-note { margin-left: auto; padding-left: 12px; font-size: 10.5px; color: var(--faint); }
.pathbar .path-note.gw { color: var(--ok); }
.pathbar .path-note.direct { color: var(--warn); }
.pathbar .node.praxis { border-color: var(--accent); background: var(--accent-soft); }
.pathbar .node.praxis .n i { background: var(--accent); }
details.how summary { cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
details.how p { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.55; }
details.how b { color: var(--ink); }
.stage-body details.rubric { margin: 16px 0 0; }
.stage-body details.rubric p { font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; color: var(--faint); font-size: 10.5px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 7px; height: 7px; border-radius: 2px; display: block; }

/* live status */
#liveStatus { font-size: 11px; color: var(--muted); min-height: 16px; }
#liveStatus.ok { color: var(--ok); }
#liveStatus.err { color: var(--bad); }

/* ---------- pipeline strip ---------- */
.pipe {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0;
  margin: 0 0 16px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
}
.pipe-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--faint); margin-right: 12px; white-space: nowrap;
}
.node {
  display: flex; flex-direction: column; gap: 1px; min-width: 0;
  border: 1px solid var(--line); border-radius: 7px; background: var(--panel);
  padding: 5px 9px;
}
.node .n { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.node .n i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; flex: none; }
.node .t { font-size: 9.5px; color: var(--faint); white-space: nowrap; }
.node .n .lat { font-weight: 500; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.node.done { border-color: var(--ok); }
.node.done .n i { background: var(--ok); }
.node.active { border-color: var(--warn); }
.node.active .n i { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.node.off { opacity: .55; }
.link { width: 16px; height: 1px; background: var(--line); flex: none; }
.link.fan { height: 22px; width: 16px; background: none;
  border-left: 1px solid var(--line); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  border-radius: 3px 0 0 3px; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- composer ---------- */
.composer { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 16px; }
.composer h2 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
.composer .note { margin: 0 0 12px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.composer .note b { color: var(--ink); }
.composer textarea {
  width: 100%; min-height: 260px; resize: vertical; display: block;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2);
  color: var(--ink); font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 10px 12px;
}
.composer textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.composer.dragover textarea { border-color: var(--accent); background: var(--accent-soft); }
.composer .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.composer .row .note { margin: 0; }
.composer input[type="file"] { display: none; }
.rail-new {
  width: 100%; text-align: left; border: 1px dashed var(--line); border-radius: 7px;
  background: none; padding: 6px 8px; margin-top: 6px; cursor: pointer;
  font-size: 11.5px; color: var(--muted);
}
.rail-new:hover { border-color: var(--accent); color: var(--accent-ink); }
.rail-new[aria-current="true"] { border-style: solid; background: var(--panel); color: var(--ink); }
.unscored-note { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2);
  padding: 8px 11px; font-size: 11.5px; color: var(--muted); margin: 0 0 14px; }
.spin {
  width: 10px; height: 10px; border: 1.5px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.revealable { transition: opacity .32s ease, transform .32s ease; }
.revealable.pending { opacity: 0; transform: translateY(7px); }
@media (prefers-reduced-motion: reduce) {
  .revealable { transition: none; }
  .spin { animation-duration: 2s; }
}

/* routing: the pool that answered, and the audit handle for it */
.chip.route { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
.chip.route.cpu { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.chip.route.gpu { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.chip.route.none { border-style: dashed; }
.stage-head .chip.route { margin-left: 2px; }

/* failure gallery */
.fail-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
.fail-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 7px; align-items: center;
  padding: 6px 9px; border: 0; border-bottom: 1px solid var(--line-2); background: none;
  width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.fail-row:last-child { border-bottom: 0; }
.fail-row:hover { background: var(--panel-2); }
.fail-row .who { min-width: 0; }
.fail-row .doc { display: block; font-size: 10px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fail-row .what { display: block; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fail-row .v { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.fail-row .v.bad { color: var(--bad); }
.fail-row .v.warn { color: var(--warn); }

/* the request that produced a stage, folded away */
details.req { margin-top: 8px; border-top: 1px dashed var(--line-2); padding-top: 7px; }
details.req summary { cursor: pointer; font-size: 10.5px; color: var(--muted); }
details.req pre { margin: 7px 0 0; padding: 8px 9px; background: var(--panel-2); border: 1px solid var(--line-2);
  border-radius: 6px; font-size: 10.5px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 220px; overflow-y: auto; color: var(--muted); }
details.req .meta { margin-top: 5px; font-size: 10px; color: var(--faint); }

/* throughput table */
.ptable { width: 100%; border-collapse: collapse; font-size: 10.5px; font-variant-numeric: tabular-nums; }
.ptable th { text-align: right; font-weight: 600; color: var(--faint); padding: 3px 4px; border-bottom: 1px solid var(--line); }
.ptable th:first-child, .ptable td:first-child { text-align: left; }
.ptable td { text-align: right; padding: 4px; border-bottom: 1px solid var(--line-2); color: var(--muted); }
.ptable td b { color: var(--ink); font-weight: 600; }
.ptable tr:last-child td { border-bottom: 0; }

/* corpus run */
.corpus-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 12px; }
.corpus-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line-2); font-size: 11.5px; }
.corpus-row:last-child { border-bottom: 0; }
.corpus-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.corpus-row .state { font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.corpus-row.done .state { color: var(--ok); }
.corpus-row.err .state { color: var(--bad); }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  html, body { height: auto; }
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-areas: "rail" "main" "side"; flex: none; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .doc-list { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .doc-item { min-width: 190px; flex: none; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .main { overflow: visible; padding: 18px 16px 40px; }
  .side { padding: 16px; }
}
@media (max-width: 680px) {
  header.top { padding: 10px 14px; }
  .pathbar { padding: 8px 14px; }
  .chips { margin-left: 0; }
  .extracts { grid-template-columns: 1fr; padding: 10px; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .doc-head h2 { font-size: 13.5px; }
  .blockquote { max-height: 150px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Stage Review</h1>
    <p id="runLine">loading run…</p>
    <p id="hardwareLine" title="Read from the run's recorded pool map. A config or route name is not a hardware claim."></p>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chips" style="margin-left:0">
    <a class="btn ghost" href="/monitor" target="_blank" rel="noopener"
       title="Pool telemetry: what each pool and each recorded sweep spent">Telemetry</a>
    <a class="btn ghost" href="/guide" target="_blank" rel="noopener"
       title="Presenter's guide: how to talk through this page">Guide</a>
    <button class="btn ghost" id="truthBtn" aria-pressed="true" title="Show or hide the answer key (CUAD annotations)">Ground truth: on</button>
    <button class="btn ghost" id="themeBtn" title="Switch theme">Theme</button>
  </div>
</header>
<div class="pathbar" id="pathbar" aria-live="polite"></div>

<div class="shell">
  <nav class="rail" aria-label="Documents">
    <div class="rail-head"><span>Documents</span><span id="railCount"></span></div>
    <div class="doc-list" id="docList"></div>
    <button class="rail-new" id="newDocBtn" aria-current="false">＋ New document</button>
  </nav>

  <main class="main" id="main"></main>

  <aside class="side" id="side"></aside>
</div>

<script>
"use strict";

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v == null ? "—" : (v * 100).toFixed(1) + "%");
const ms = (v) => (v == null ? "—" : Math.round(v).toLocaleString() + " ms");
const shortId = (id) => (!id ? "—" : id.length > 46 ? id.slice(0, 24) + "…" + id.slice(-16) : id);
const sleep = (n) => new Promise((r) => setTimeout(r, n));

const VERDICT = {
  correct:        ["match", "ok"],
  correct_absent: ["absent — correct", "ok"],
  wrong_quote:    ["quote not matched", "bad"],
  false_positive: ["not annotated", "bad"],
  missed:         ["missed", "warn"],
  missing:        ["no record", "warn"],
  unscored:       ["unscored — no annotations", "neutral"],
};
// A verdict scores the model against the annotation, not against the
// contract. "Not annotated" is a miss even when the quoted words really are
// in the file — CUAD may have marked the category impossible, or drawn the
// category boundary elsewhere — so the badge carries that caveat itself
// rather than a phrase that reads as a statement about the document.
const VERDICT_NOTE = {
  false_positive: "found a clause, but CUAD annotates none for this category. "
    + "The quote may still be real text in the contract — check the highlighted excerpt.",
};
const RISK_CLASS = { high: "bad", medium: "warn", low: "ok" };
const NEW_DOC = "__new__";
// Config names come from the payload (canonical configs.json), not a copy here.

const S = {
  data: null,
  compare: null,
  showingCompare: false,
  current: null,
  live: {},
  draft: "",
  draftName: null,
  endpoint: null,
  howOpen: false,
  reveal: true,
  playing: false,
  busy: false,
  corpus: null,
};

/* ---------- boot ---------- */
init();

async function init() {
  try {
    const res = await fetch("/api/run");
    if (!res.ok) throw new Error("HTTP " + res.status);
    S.data = await res.json();
  } catch (e) {
    $("#main").innerHTML = `<p style="color:var(--bad)">Could not load run data: ${esc(e.message)}</p>`;
    return;
  }
  S.primary = S.data;
  S.current = S.data.documents[0] ? S.data.documents[0].doc_id : null;
  const saved = store("stage-ui-truth");
  S.reveal = saved !== "off";
  const theme = store("stage-ui-theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  applyTruth();
  renderAll();
  pollEndpoint();
  // Warmth drifts (a request queue can form), so keep the chip honest.
  if (S.data.live_enabled) setInterval(pollEndpoint, 15000);
}

function store(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function save(key, value) {
  try { localStorage.setItem(key, value); } catch { /* private mode */ }
}

function applyTruth() {
  document.body.classList.toggle("hide-truth", !S.reveal);
  const b = $("#truthBtn");
  b.textContent = S.reveal ? "Ground truth: on" : "Ground truth: off";
  b.setAttribute("aria-pressed", String(S.reveal));
}

$("#truthBtn").addEventListener("click", () => {
  S.reveal = !S.reveal;
  save("stage-ui-truth", S.reveal ? "on" : "off");
  applyTruth();
});

$("#themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark"
    || (!document.documentElement.dataset.theme
        && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  save("stage-ui-theme", next);
});

/* ---------- helpers ---------- */
function currentDoc() {
  if (!S.data) return null;
  return S.live[S.current] || S.data.documents.find((d) => d.doc_id === S.current) || null;
}

function docState(doc) {
  if (!doc) return "mid";
  if (doc.scored === false) return "mid";
  const vs = doc.extracts.map((e) => e.verdict);
  if (vs.some((v) => v === "wrong_quote" || v === "false_positive")) return "bad";
  if (vs.some((v) => v === "missed" || v === "missing")) return "warn";
  return "ok";
}

function stageCards() {
  return $$(".revealable", $("#main"));
}

function medRank(key) {
  if (key === "classify") return 0;
  if (key.startsWith("extract:")) return 1;
  return 2;
}

/* ---------- render: header + rail ---------- */
function renderAll() {
  renderMeta();
  renderPath();
  renderRail();
  renderMain();
  renderSide();
}

// The run-level request path, so the A/B toggle changes more than the numbers:
// it shows whether praxis was in the path at all. Every node is read from the
// payload's meta/routing, not inferred from the page being served.
function renderPath() {
  const el = $("#pathbar");
  if (!el || !S.data) return;
  const m = S.data.meta;
  const r = S.data.routing || {};
  const nodes = [];
  const add = (label, sub, cls = "", title = "") => nodes.push(
    `<div class="node ${cls}"${title ? ` title="${esc(title)}"` : ""}>
      <span class="n"><i></i>${esc(label)}</span>
      <span class="t">${esc(sub)}</span>
    </div>`);
  const arrow = `<span class="parrow" aria-hidden="true">→</span>`;

  const stages = "classify · extract ×4 · risk · report";
  if (m.gateway) {
    add("Batch runner", "hybrid-run --target gateway · shared prompts · CPU-side");
    add("trace-ui relays", "ingress + per-pool · audit trail");
    add("praxis", "API key → entry + step → pool, every call", "praxis",
        "Every model call passes through Praxis. The pipeline picks the entry per step; the pinned routing config picks the pool.");
    const routes = Object.keys(r.routes || {});
    const configured = Object.keys(m.pools || {});
    const pools = routes.length ? routes : configured;
    const answered = routes.length
      ? `${Object.values(r.routes).reduce((a, n) => a + n, 0)} calls answered`
      : "configured, not used";
    const hardware = pools.map((p) => m.pools?.[p]?.hardware && `${p}: ${m.pools[p].hardware}`)
      .filter(Boolean).join(" · ");
    add(pools.join(" · ") || "pool", answered, "", hardware);
    add(stages, "model calls · routed per call · report once per run");
    const models = Object.entries(r.models || {});
    add(models.length > 1 ? "served models" : "served model",
      models.length
        ? models.map(([name, n]) => `${name} ×${n}`).join(" · ")
        : (m.model || m.served_model || "not recorded"),
      "", "Per-call model identity from the response bodies; a through-stack run can use different models for different stages.");
  } else {
    const endpoint = m.endpoint ? shortId(m.endpoint) : "OpenAI-compatible endpoint";
    add("Batch runner", "hybrid-run --target direct · shared prompts · CPU-side");
    add("vLLM endpoint", m.hardware ? `${endpoint} · ${m.hardware}` : endpoint);
    add(stages, "one endpoint · no per-stage routing · report once per run");
    add(m.model || m.served_model || "model", "served model");
  }

  const note = m.gateway
    ? "client CPU · control plane routes · model work in pools"
    : "client CPU · all model work at the endpoint · no praxis";
  el.innerHTML = `<span class="pipe-label">Request path</span>
    ${nodes.join(arrow)}
    <span class="path-note ${m.gateway ? "gw" : "direct"}">${esc(note)}</span>`;
}

function renderMeta() {
  const m = S.data.meta;
  const cfg = m.config;
  const cfgLabel = cfg ? `config ${cfg}` : (m.arm === "direct" ? "direct run" : null);
  const runName = m.run && m.run !== cfg ? m.run : null;
  const mode = m.mode && m.mode !== cfg && m.mode !== "matrix"
    && !(m.config_meta && m.config_meta.mode === m.mode) ? m.mode : null;
  $("#runLine").textContent = [cfgLabel, runName, mode]
    .filter(Boolean).join(" · ");

  // What actually served the run, from the recorded pool map. The config name
  // describes routing behavior, so it cannot answer this question on its own.
  const hardware = (m.pool_hardware || []).map((p) => {
    const detail = [p.model, p.hardware].filter(Boolean).join(", ");
    return detail ? `route ${p.route} (${detail})` : `route ${p.route} (hardware not recorded)`;
  });
  if (m.gateway) {
    if (!hardware.length) hardware.push("hardware not recorded for this run");
    const violations = S.data.routing?.sensitive_violations;
    if (violations != null) {
      hardware.push(`${violations} sensitive violation${violations === 1 ? "" : "s"}`);
    }
  } else {
    hardware.push(m.hardware ? `endpoint ${m.hardware}` : "endpoint hardware not recorded");
  }
  $("#hardwareLine").textContent = hardware.join(" · ");

  const parts = [];

  // Provenance leads, because it changes what every other number on the page
  // is allowed to claim. An unlabelled run defaults to example, not measured.
  const measured = m.provenance === "measured";
  const where = [m.cluster, m.environment].filter(Boolean).join(" · ");
  const provNote = [
    measured
      ? "A measured run: the pools were real, not simulated."
      : "Example run: recorded before the ROSA baseline. Treat every number here as illustrative, not as a measured result.",
    where ? `Recorded on ${where}.` : "No environment was recorded for this run.",
    m.started_at ? `Started ${m.started_at}.` : null,
    m.git_sha ? `Commit ${String(m.git_sha).slice(0, 12)}${m.git_dirty ? " (uncommitted changes)" : ""}.` : null,
    m.concurrency != null ? `Concurrency ${m.concurrency}.` : null,
    m.timeout_s != null ? `Timeout ${m.timeout_s}s.` : null,
    m.wall_s != null ? `Wall time ${m.wall_s}s.` : null,
    Object.keys(m.pools || {}).length ? `Pools: ${Object.keys(m.pools).join(", ")}.` : null,
  ].filter(Boolean).join(" ");
  parts.push(`<span class="chip ${measured ? "prov-ok" : "prov-example"}" title="${esc(provNote)}"><span class="dot ${measured ? "ok" : "warn"}"></span>${measured ? `measured${where ? ` · ${esc(where)}` : ""}` : "example data"}</span>`);

  // One chip for the document count; a folded duplicate is a caveat on that
  // number, not a separate fact worth a separate chip.
  const dup = m.duplicate_docs
    ? ` · ${m.duplicate_docs} repeated doc_id${m.duplicate_docs === 1 ? "" : "s"} folded`
    : "";
  parts.push(`<span class="chip" title="${esc(`${m.docs} documents${dup}. ${dup ? "The first pass is shown, so no contract is scored against two cards." : ""}`)}"><b>${m.docs}</b> documents${dup}</span>`);

  // Whether the calls were routed is the run's defining property, so it is
  // stated in the header instead of being inferred from an empty panel.
  parts.push(m.gateway
    ? `<span class="chip live"><span class="dot ok"></span>gateway-routed</span>`
    : `<span class="chip" title="The client called one vLLM endpoint: no gateway, no pool choice, no trace id."><span class="dot warn"></span>direct — no gateway</span>`);

  // A through-stack run can use different models for different stages. In that
  // case a single "model" chip would misstate the run, so count them and let
  // the path strip / routing panel name them.
  const routedModels = Object.entries(S.data.routing?.models || {});
  if (m.gateway && routedModels.length > 1) {
    const list = routedModels.map(([name, n]) => `${name} ×${n}`).join(" · ");
    parts.push(`<span class="chip" title="${esc(`Per-call models: ${list}`)}">served models <b>${routedModels.length}</b></span>`);
  } else if (m.model) {
    // The checkpoint is what makes a run the run: the endpoint only ever
    // reports its served alias, so both are shown and the alias is named.
    const note = [m.hardware, m.served_model && `served as ${m.served_model}`,
      m.thinking ? "thinking mode" : null].filter(Boolean).join(" · ");
    const alias = m.served_model && m.served_model !== m.model
      ? ` <span style="color:var(--muted)">(${esc(m.served_model)})</span>` : "";
    parts.push(`<span class="chip" title="${esc(note)}">model <b>${esc(m.model)}</b>${alias}</span>`);
  }
  if (S.data.compare_available || S.compare) {
    parts.push(`<button class="btn ghost" id="abBtn" aria-pressed="${S.showingCompare}"
      title="Switch to the other run of the same documents">A/B ${S.showingCompare ? "B" : "A"}</button>`);
  }
  if (S.data.live_enabled) {
    parts.push(endpointChip());
  } else {
    parts.push(`<span class="chip">live: off</span>`);
  }
  $("#chips").innerHTML = parts.join("");
  const ab = $("#abBtn");
  if (ab) ab.addEventListener("click", toggleCompare);
}

// The second run is fetched once, on first use. Both payloads are the same
// shape, so switching is a pointer swap and a re-render — no re-scoring.
async function toggleCompare() {
  if (!S.compare) {
    try {
      const res = await fetch("/api/run?arm=compare");
      if (!res.ok) throw new Error("HTTP " + res.status);
      S.compare = await res.json();
    } catch {
      if ($("#chips")) {
        $("#chips").insertAdjacentHTML("beforeend",
          `<span class="chip"><span class="dot bad"></span>A/B unavailable</span>`);
      }
      return;
    }
  }
  S.showingCompare = !S.showingCompare;
  S.data = S.showingCompare ? S.compare : S.primary;
  if (!S.data.documents.some((d) => d.doc_id === S.current)) {
    S.current = S.data.documents[0]?.doc_id ?? null;
  }
  renderAll();
}

// The header chip answers "is the thing on the other end awake?", which is
// the first thing an audience asks before a live run. Best effort: the page
// works with it unavailable.
function endpointChip() {
  const e = S.endpoint;
  const name = esc(shortId(S.data.meta.endpoint || "endpoint"));
  if (!e) return `<span class="chip live" id="endpointChip"><span class="dot ok"></span>live: ${name}</span>`;
  if (e.live_enabled === false) return `<span class="chip" id="endpointChip">live: off</span>`;
  if (e.error) {
    return `<span class="chip" id="endpointChip" title="${esc(e.error)}">
      <span class="dot bad"></span>live: unreachable</span>`;
  }
  const load = e.running == null
    ? ""
    : ` · <b>${e.running}</b> running${e.waiting ? `, ${e.waiting} waiting` : ""}`;
  return `<span class="chip live" id="endpointChip" title="/v1/models answered; load from /metrics">
    <span class="dot ok"></span>${esc(e.model || "warm")}${load}</span>`;
}

async function pollEndpoint() {
  if (!S.data?.live_enabled) return;
  try {
    const res = await fetch("/api/endpoint");
    if (!res.ok) return;
    S.endpoint = await res.json();
    const chip = $("#endpointChip");
    if (chip) chip.outerHTML = endpointChip();
  } catch {
    /* decoration only: an unreachable proxy leaves the fallback chip */
  }
}

function submittedDocs() {
  const known = new Set(S.data.documents.map((d) => d.doc_id));
  return Object.values(S.live).filter((d) => !known.has(d.doc_id));
}

function renderRail() {
  const rows = S.data.documents.map((base) => ({ base, doc: S.live[base.doc_id] || base }))
    .concat(submittedDocs().map((doc) => ({ base: doc, doc })));
  $("#railCount").textContent = rows.length;
  $("#docList").innerHTML = rows.map(({ base, doc }) => {
    const state = docState(doc);
    const flags = [];
    if (doc.fully_correct) flags.push(`<span class="flag full" title="Every field correct">✓</span>`);
    if (doc.scored === false) flags.push(`<span class="flag live" title="Submitted at runtime — no annotations">new</span>`);
    else if (S.live[base.doc_id]) flags.push(`<span class="flag live" title="Result from a live run">live</span>`);
    return `<button class="doc-item" data-id="${esc(doc.doc_id)}" aria-current="${doc.doc_id === S.current}">
      <span class="dot ${state}"></span>
      <span class="name mono" title="${esc(doc.doc_id)}">${esc(shortId(doc.doc_id))}</span>
      <span class="flag">${flags.join(" ")}</span>
    </button>`;
  }).join("");

  const newBtn = $("#newDocBtn");
  newBtn.setAttribute("aria-current", String(S.current === NEW_DOC));
  newBtn.disabled = !S.data.live_enabled;
  newBtn.title = S.data.live_enabled
    ? "Paste or open a contract and run it through the pipeline"
    : "Server was started without --endpoint, so live runs are off";

  $$("#docList .doc-item").forEach((el) => {
    el.addEventListener("click", () => {
      if (S.playing) return;
      S.current = el.dataset.id;
      renderRail();
      renderMain();
    });
  });
}

function openComposer() {
  if (S.playing || !S.data || !S.data.live_enabled) return;
  S.current = NEW_DOC;
  renderRail();
  renderMain();
}

$("#newDocBtn").addEventListener("click", openComposer);

/* ---------- render: main ---------- */
function renderMain() {
  if (S.current === NEW_DOC) { renderComposer(); return; }
  const doc = currentDoc();
  if (!doc) { $("#main").innerHTML = "<p>No documents in this run.</p>"; return; }

  const isLive = Boolean(S.live[doc.doc_id]);
  const scored = doc.scored !== false;
  const totalMs = docModelMs(doc);
  // A scored document run live exists twice: once as recorded, once measured
  // now. Showing both is the point — the same prompts are not reproducible.
  const recorded = S.data.documents.find((d) => d.doc_id === doc.doc_id);
  const comparison = scored && recorded && isLive
    ? `<span class="chip">live <b>${(docModelMs(doc) / 1000).toFixed(1)}s</b>
        vs recorded <b>${(docModelMs(recorded) / 1000).toFixed(1)}s</b> model time</span>`
    : "";

  const chips = [
    `<span class="chip">${doc.chars.toLocaleString()} chars</span>`,
    scored && doc.type_truth ? `<span class="chip truth-only" title="the document type in the CUAD annotation (the answer key)">ground truth: ${esc(doc.type_truth)}</span>` : "",
    scored ? `<span class="chip truth-only" title="the risk level the rubric gives the annotated clauses">ground truth risk: <b>${esc(doc.risk_truth || "—")}</b></span>` : "",
    scored ? "" : `<span class="chip">submitted document · no annotations</span>`,
  ].join("");

  const stats = scored
    ? `${fieldMeter(doc)}
      <span class="stamp truth-only ${doc.fully_correct ? "full" : ""}">
        ${doc.fully_correct ? "✓ fully correct" : "not fully correct"} · ${doc.correct_fields}/${doc.fields_total} fields
      </span>`
    : `<p class="unscored-note" style="margin:0">There are no annotations for this document, so nothing here is scored.
        Each quote is still checked against the source text, which is what a reviewer would do first.</p>`;

  $("#main").innerHTML = `
    <div class="doc-head">
      <div class="idwrap">
        <h2 class="mono">${esc(doc.doc_id)}</h2>
        <div class="sub">${chips}</div>
      </div>
      <div class="actions">
        ${isLive || !scored ? `<span class="chip live"><span class="dot ok"></span>live result</span>` : ""}
        <span class="chip" id="clock" title="Sum of this document's stage latencies">model time <b>${(totalMs / 1000).toFixed(1)}s</b></span>
        <button class="btn ghost" id="replayBtn">Replay</button>
        <button class="btn primary" id="liveBtn" ${S.data.live_enabled && scored ? "" : "disabled"}
          title="${!scored ? "This document already came from a live run"
            : S.data.live_enabled ? "Send this document through the endpoint"
            : "Server was started without --endpoint"}">Run live</button>
      </div>
    </div>
    <div class="doc-stats">
      ${stats}
      ${comparison}
      ${isLive ? `<span class="chip">live measurement, outside the scored run</span>` : ""}
    </div>
    <div id="liveStatus" role="status"></div>
    ${pipelineStrip(doc)}
    ${howToRead()}
    <div class="flow" id="flow">
      ${classifyCard(doc)}
      ${extractsCard(doc)}
      ${riskCard(doc)}
    </div>
  `;

  $("#replayBtn").addEventListener("click", replay);
  $("#liveBtn").addEventListener("click", runLive);
  // The disclosure sits inside the document view, which re-renders on every
  // document switch; remember its state so it does not snap shut each time.
  const how = $("#main details.how");
  if (how) how.addEventListener("toggle", () => { S.howOpen = how.open; });
}

/* ---------- pipeline strip ---------- */
function nodeState(rec) {
  if (!rec) return "off";
  return rec.outcome === "served" ? "done" : "off";
}

function pipeNode(key, label, sub, cls) {
  return `<div class="node ${cls}" data-node="${esc(key)}">
    <span class="n"><i></i>${esc(label)}</span>
    <span class="t">${sub}</span>
  </div>`;
}

function pipelineStrip(doc) {
  const c = doc.classify;
  const r = doc.risk;
  const ex = doc.extracts || [];
  const served = ex.filter((e) => e.outcome === "served").length;
  const exMs = ex.reduce((a, e) => a + (e.latency_ms || 0), 0);
  const cSub = c ? `${ms(c.latency_ms)} · doc text` : "no record";
  const exSub = served
    ? `${ms(exMs)} total · ${served}/${ex.length} served · parallel`
    : `no record · ${ex.length} clauses`;
  const rSub = r ? `${ms(r.latency_ms)} · reads the extracts` : "no record";
  return `<div class="pipe" aria-label="Pipeline stages">
    <span class="pipe-label">Pipeline</span>
    ${pipeNode("classify", "Classify", cSub, nodeState(c))}
    <span class="link fan" aria-hidden="true"></span>
    ${pipeNode("extract", `Extract ×${ex.length}`, exSub, served ? "done" : "off")}
    <span class="link" aria-hidden="true"></span>
    ${pipeNode("risk", "Risk", rSub, nodeState(r))}
    <span class="link" aria-hidden="true"></span>
    <div class="node off" data-node="report" title="The report reads every document in the run, so it is not part of one document's chain">
      <span class="n"><i></i>Report</span>
      <span class="t">whole run · side panel</span>
    </div>
  </div>`;
}

function docModelMs(doc) {
  return (doc.extracts || []).reduce((a, e) => a + (e.latency_ms || 0), 0)
    + (doc.classify?.latency_ms || 0) + (doc.risk?.latency_ms || 0);
}

function howToRead() {
  const m = S.data.metrics;
  const docs = S.data.documents.length;
  const baseLevel = m.majority_risk_level || "most common level";
  return `<details class="how"${S.howOpen ? " open" : ""}>
    <summary>How to read this</summary>
    <p><b>Extraction</b> is a copy task: the model quotes the clause and scoring checks whether the normalised strings contain each other. A wider quote that includes the annotated text passes; a correct paraphrase fails.</p>
    <p><b>Risk</b> is judgment. Compare it with the line on the bar in the side panel — a model at that line is only answering "${esc(baseLevel)}"${m.majority_risk_count ? ` (${m.majority_risk_count} of ${docs})` : ""}, not applying the rubric at all.</p>
    <p><b>Fully correct</b> means every field in that document: type, each clause, and risk.</p>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>match / correct absence</span>
      <span><i style="background:var(--bad)"></i>wrong quote or false positive</span>
      <span><i style="background:var(--warn)"></i>missed / absent</span>
    </div>
  </details>`;
}

function fieldMeter(doc) {
  const cells = [];
  if (doc.classify && doc.classify.match !== null) {
    cells.push(`<i class="${doc.classify.match ? "hit" : "miss"}" title="Document type"></i>`);
  }
  for (const e of doc.extracts) {
    const cls = e.verdict === "correct" ? "hit"
      : e.verdict === "correct_absent" ? "absent"
      : e.verdict === "missing" ? "" : "miss";
    cells.push(`<i class="${cls}" title="${esc(e.clause)}: ${esc((VERDICT[e.verdict] || ["?"])[0])}"></i>`);
  }
  if (doc.risk) cells.push(`<i class="${doc.risk.match ? "hit" : "miss"}" title="Risk level"></i>`);
  return `<div class="meter truth-only" aria-label="Per-field results">${cells.join("")}</div>`;
}

/* ---------- routing + request helpers ---------- */
function routeClass(route) {
  return !route ? "none" : (/cpu/i.test(route) ? "cpu" : "gpu");
}

// The pool that answered, when the run recorded one. A direct run has no
// route at all, and the card says nothing rather than inventing a pool.
function routeChip(route, trace) {
  if (!route) return "";
  return `<span class="chip route ${routeClass(route)}"
    title="Praxis route name — not the model and not the hardware${trace ? ` · trace ${esc(trace)}` : " · no trace id"}">route <b>${esc(route)}</b></span>`;
}

// The rest of the praxis path, each part read from a response header or the
// response body — never inferred from the prompt. An absent value renders
// nothing, so a direct run's cards stay bare instead of claiming a decision.
function entryChip(entry) {
  if (!entry) return "";
  return `<span class="chip" title="Gateway entry the request came through">entry <b>${esc(entry)}</b></span>`;
}
function labelChip(decision) {
  if (!decision) return "";
  return `<span class="chip" title="Label praxis applied to this request">label <b>${esc(String(decision).toUpperCase())}</b></span>`;
}
function modelChip(model) {
  if (!model) return "";
  return `<span class="chip" title="Served model, as the response named it">model <b>${esc(model)}</b></span>`;
}

function usageText(u) {
  if (!u || u.total_tokens == null) return "";
  return `${u.prompt_tokens ?? "?"} in · ${u.completion_tokens ?? "?"} out`;
}

function requestBlock(rec) {
  if (!rec || !rec.request) return "";
  const msgs = rec.request.messages.map((m) =>
    `<pre>${esc(m.role)}:\n${esc(m.content)}</pre>`).join("");
  const meta = [
    rec.request.model,
    rec.request.max_tokens != null ? `max_tokens ${rec.request.max_tokens}` : null,
    rec.request.temperature != null ? `temperature ${rec.request.temperature}` : null,
  ].filter(Boolean).join(" · ");
  return `<details class="req"><summary>What we sent</summary>${msgs}
    <div class="meta">${esc(meta)}</div></details>`;
}

function classifyCard(doc) {
  const c = doc.classify;
  if (!c) {
    return stage(1, "Classify", "document text", null,
      `<p class="muted" style="color:var(--muted);margin:0">No classify record in this run.</p>`, 0);
  }
  const match = c.match === null ? ""
    : c.match
      ? `<span class="badge ok truth-only" title="agrees with the CUAD annotation">matches ground truth</span>`
      : `<span class="badge bad truth-only" title="the CUAD annotation for this document">ground truth: ${esc(c.truth || "—")}</span>`;
  const body = `
    <div class="classify-row">
      <div class="pred">${esc(c.type || "—")}</div>
      <div class="kv"><span class="k">initial term</span><span class="v">${c.initial_term_months != null ? c.initial_term_months + " months" : "—"}</span></div>
      <div class="kv"><span class="k">reference</span><span class="v mono">${esc(c.ref || "—")}</span></div>
      <div class="kv"><span class="k">outcome</span><span class="v">${esc(c.outcome)}</span></div>
      <div style="margin-left:auto">${match}</div>
    </div>
    <div class="x-meta" style="margin-top:8px">
      ${routeChip(c.route, c.trace_id)}${entryChip(c.entry)}${labelChip(c.decision)}${modelChip(c.model)}
      ${usageText(c.usage) ? `<span>${esc(usageText(c.usage))}</span>` : ""}
    </div>
    ${requestBlock(c)}`;
  return stage(1, "Classify", "reads the document text only", c.latency_ms, body,
               c.latency_ms, "classify", routeChip(c.route, c.trace_id) + modelChip(c.model));
}

function extractsCard(doc) {
  const sum = doc.extracts.reduce((a, e) => a + (e.latency_ms || 0), 0);
  const cards = doc.extracts.map((e) => extractCard(e, doc.scored !== false)).join("");
  // The route is a policy name, not the model that answered. On the measured
  // stack every extract routes to vllm-cpu, but that route fronts the CUAD
  // specialist: three clauses are answered there and the data-protection
  // follow-up is forwarded to the CPU vLLM. Show the served models first, then
  // the route they arrived through, so the header does not read as hardware.
  const served = Object.entries(doc.extract_models || {})
    .sort((a, b) => b[1] - a[1])
    .map(([m, n]) => `<b>${esc(m)}</b> ×${n}`).join(" · ");
  const servedChip = served
    ? `<span class="chip" title="Served model, as the response named it">served by ${served}</span>` : "";
  const routes = Object.entries(doc.extract_routes || {})
    .sort((a, b) => b[1] - a[1])
    .map(([r, n]) => `<span class="chip route ${routeClass(r)}" title="Praxis route name — not the model and not the hardware">route <b>${esc(r)}</b> ×${n}</span>`).join("");
  return `<section class="stage" data-node="extract">
    <div class="stage-head">
      <span class="num">02</span>
      <h3>Extract clauses</h3>
      <span class="dep">each reads the document text + its clause name only → independent of the others</span>
      ${servedChip}${routes}
      <span class="lat">${ms(sum)} · ${doc.extracts.length} requests</span>
    </div>
    <div class="extracts">${cards}</div>
  </section>`;
}

function extractCard(e, scored = true) {
  const [vlabel, vclass] = VERDICT[e.verdict] || ["unknown", "neutral"];
  const vnote = VERDICT_NOTE[e.verdict];
  const latency = e.latency_ms != null ? ms(e.latency_ms) : "";
  const verified = e.verified === null ? ""
    : e.verified
      ? `<span class="ok">✓ quote located in source</span>`
      : `<span class="bad">✗ quote not located in source</span>`;

  let quote;
  if (!e.found) {
    quote = `<blockquote class="empty">Model reported no ${esc(e.clause.replace(/_/g, " "))} clause.</blockquote>`;
  } else {
    quote = `<blockquote>${esc(e.claim)}${e.claim_truncated ? `<span class="bad"> …[clipped]</span>` : ""}</blockquote>`;
  }
  const context = e.excerpt
    ? `<div class="context">${e.excerpt.cut_before ? "…" : ""}${esc(e.excerpt.before)}<mark>${esc(e.excerpt.hit)}</mark>${esc(e.excerpt.after)}${e.excerpt.cut_after ? "…" : ""}</div>`
    : "";

  // A submitted document has no annotations at all, so there is no "annotated
  // clause" to show — an empty truth block would read as "nothing annotated
  // here", which is a different claim.
  const truth = scored ? `
    <div class="truth truth-only">
      <div class="tlabel">Annotated clause</div>
      ${e.truth
        ? `<div class="ttext">${esc(e.truth)}</div>`
        : `<div class="ttext">No clause annotated for this category.</div>`}
    </div>` : "";

  const ref = e.ref ? `<span class="mono" title="Model's reference">${esc(e.ref)}</span>` : "";
  return `<article class="x-card v-${vclass} revealable" data-ms="${e.latency_ms || 0}">
    <div class="x-head">
      <h4>${esc(e.clause.replace(/_/g, " "))}</h4>
      <span class="badge ${vclass} truth-only"${vnote ? ` title="${esc(vnote)}"` : ""}>${esc(vlabel)}</span>
      <span class="lat">${latency}</span>
    </div>
    ${quote}
    ${context}
    <div class="x-meta">${routeChip(e.route, e.trace_id)}${entryChip(e.entry)}${labelChip(e.decision)}${modelChip(e.model)}${ref}${verified}
      ${usageText(e.usage) ? `<span>${esc(usageText(e.usage))}</span>` : ""}
      ${e.outcome !== "served" ? `<span class="bad">${esc(e.outcome)}</span>` : ""}</div>
    ${truth}
    ${requestBlock(e)}
  </article>`;
}

function riskCard(doc) {
  const r = doc.risk;
  if (!r) {
    return stage(3, "Assess risk", "reads the extracted clauses", null,
      `<p style="color:var(--muted);margin:0">No risk record in this run.</p>`, 0);
  }
  const cls = RISK_CLASS[(r.risk || "").toLowerCase()] || "neutral";
  const match = r.match == null ? ""
    : r.match
      ? `<span class="badge ok truth-only" title="agrees with the CUAD annotation">matches ground truth</span>`
      : `<span class="badge bad truth-only" title="the level the CUAD annotation implies">ground truth: ${esc(r.truth || "—")}</span>`;
  const reasons = (r.reasons || []).length
    ? `<ul class="reasons">${r.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`
    : `<p class="reasons" style="color:var(--faint)">No reasons returned.</p>`;
  // The prompt asks for one overall label per contract under a fixed rule, so
  // show the rule where the label is read rather than leaving "risk" to mean
  // whatever the audience assumes. CUAD has no data-protection category; the
  // rubric only mentions it when the manifest carries that clause.
  const dp = (S.data.clause_keys || []).includes("data_protection");
  const rubric = dp
    ? "risk is high if there is no data-protection clause, or if liability is uncapped or absent; medium if termination is absent or only permitted for material breach that remains uncured; otherwise low"
    : "risk is high if liability is uncapped or absent; medium if termination is absent or only permitted for material breach that remains uncured; otherwise low";
  const body = `<div class="risk-row">
      <div class="risk-pill"><span class="badge ${cls}" style="font-size:14px;padding:4px 12px">${esc(r.risk || "—")}</span>${match}</div>
      ${reasons}
    </div>
    <details class="how rubric">
      <summary>The rubric this stage applied</summary>
      <p>“Assess the overall risk of this contract given the extracted clauses below. Apply exactly this rubric: ${rubric}.”</p>
      <p>The annotated level is produced by <b>the same rule applied to the expert clauses</b>, so this is a <b>rubric-following check</b>, not a legal opinion. It is <b>one label per contract</b>, not one per clause.</p>
    </details>
    <div class="x-meta" style="margin-top:8px">
      ${routeChip(r.route, r.trace_id)}${entryChip(r.entry)}${labelChip(r.decision)}${modelChip(r.model)}
      ${usageText(r.usage) ? `<span>${esc(usageText(r.usage))}</span>` : ""}
    </div>
    ${requestBlock(r)}`;
  return stage(3, "Assess risk", "reads the extracted clauses — the only stage that waits",
               r.latency_ms, body, r.latency_ms, "risk", routeChip(r.route, r.trace_id) + modelChip(r.model));
}

function stage(num, title, dep, latency, body, msVal = latency, nodeKey = "", head = "") {
  return `<section class="stage revealable" data-ms="${msVal || 0}"${nodeKey ? ` data-node="${nodeKey}"` : ""}>
    <div class="stage-head">
      <span class="num">0${num}</span>
      <h3>${esc(title)}</h3>
      <span class="dep">${esc(dep)}</span>
      ${head}
      <span class="lat">${latency != null ? ms(latency) : ""}</span>
    </div>
    <div class="stage-body">${body}</div>
  </section>`;
}

/* ---------- render: side ---------- */
/* ---------- side: routing, load, throughput, failures ---------- */
function routingBlock() {
  const r = S.data.routing || {};
  const routes = Object.entries(r.routes || {}).sort((a, b) => b[1] - a[1]);
  if (!routes.length) {
    return `<details class="fold">
      <summary>Where the calls went</summary>
      <div class="fold-body"><p class="note" style="margin-top:0">No route was reported for any call. This is the
        <b>direct run</b>: every request went to one vLLM endpoint, so there was no pool to
        choose and no trace id to show.</p></div>
    </details>`;
  }
  const total = routes.reduce((a, [, n]) => a + n, 0);
  const rows = routes.map(([route, n]) => {
    const sensitive = (r.sensitive_routes || {})[route] || 0;
    return `<div class="check" style="flex-direction:row;align-items:center;gap:8px">
      <span class="chip route ${routeClass(route)}">${esc(route)}</span>
      <span style="font-size:11px;color:var(--muted)" class="mono">${n} calls · ${Math.round(n / total * 100)}%</span>
      <span style="margin-left:auto;font-size:10.5px;color:var(--faint)">${sensitive} sensitive</span>
    </div>`;
  }).join("");
  const entries = Object.entries(r.entries || {})
    .map(([k, n]) => `<span class="count">entry ${esc(k)} <b>${n}</b></span>`).join("");
  // The label praxis assigned, which is what chose the pool. Shown next to
  // the pools above so the decision and its outcome are read together.
  const labels = Object.entries(r.labels || {})
    .map(([k, n]) => `<span class="count">label ${esc(k)} <b>${n}</b></span>`).join("");
  const models = Object.entries(r.models || {})
    .map(([k, n]) => `<span class="mono">${esc(k)}</span> ×${n}`).join(" · ");
  const answeredBy = models
    ? `<p class="note" style="margin-top:8px">Answered by: ${models}. Read from each
        response body; a specialist pool names itself rather than the alias.</p>`
    : `<p class="note" style="margin-top:8px">No response named its model. This run predates
        that capture, so the page cannot say which checkpoint answered a call — only which pool
        did. Re-run to record it.</p>`;
  const safety = r.sensitive_violations != null
    ? `<p class="note" style="margin-top:8px">Sensitive steps: <b>${r.sensitive_steps}</b>
        · answered on an approved pool: <b>${r.sensitive_on_approved ?? "—"}</b>
        · violations: <b style="color:${r.sensitive_violations ? "var(--bad)" : "var(--ok)"}">${r.sensitive_violations}</b>
        ${r.sensitive_no_route ? ` · ${r.sensitive_no_route} got no answer` : ""}</p>`
    : `<p class="note" style="margin-top:8px">Sensitive steps: <b>${r.sensitive_steps}</b>
        · routes: ${(Object.entries(r.sensitive_routes || {}).map(([k, n]) => `${esc(k)} ×${n}`).join(" · ")) || "—"}</p>`;
  const silent = r.no_route
    ? `<p class="note" style="margin-top:8px">${r.no_route} call${r.no_route === 1 ? "" : "s"} came back
        with no route header${r.no_route_failed ? ` — ${r.no_route_failed} of them failed, so there was
        no successful response to read one from` : ""}. A failed call is not a routing decision;
        it is counted here, not as an unrouted request.</p>`
    : "";
  const violation = r.sensitive_violations;
  const violationLine = violation == null
    ? ""
    : `<b style="color:${violation ? "var(--bad)" : "var(--ok)"}">${violation}</b> sensitive violation${violation === 1 ? "" : "s"}`;
  return `<details class="fold">
    <summary>Where the calls went</summary>
    <div class="fold-body">
      <p class="route-line"><b>${total}</b> calls · ${routes.length} pool${routes.length === 1 ? "" : "s"}${violationLine ? ` · ${violationLine}` : ""}</p>
      <div class="check-list">${rows}</div>
      ${entries || labels ? `<div class="counts" style="margin-top:8px">${entries}${labels}</div>` : ""}
      ${answeredBy}
      ${safety}
      ${silent}
      <p class="note">${r.trace_count || 0} calls carried a gateway trace id. The pool is the one
        that answered, read from the response headers, not a label the page inferred.
        Pool names are routing tiers — <span class="mono">vllm-cpu</span> and
        <span class="mono">vllm-gpu</span> — not a hardware claim; the deployment's
        <span class="mono">*_UPSTREAM</span> config is what binds a tier to a process.</p>
      <p class="note" style="margin-top:8px">This recorded run screens with the <b>regex</b> before
        choosing an entry, so the screen is not one of the pools above. The opt-in served screen
        sends <span class="mono">screen:pii</span> to a separate Praxis control-plane listener and
        the <span class="mono">jev-cpu</span> pool (trace entry <span class="mono">screen</span>);
        it is not part of this run. The opt-in Jev cause trigger failed its CUAD F1 guardrail
        (0.625 vs 0.714) and is not adopted; the regex trigger is the default.</p>
    </div>
  </details>`;
}

function failureRows() {
  const out = [];
  for (const doc of S.data.documents) {
    for (const e of doc.extracts) {
      if (["wrong_quote", "false_positive", "missed", "missing"].includes(e.verdict)) {
        out.push({ doc, e });
      }
    }
  }
  return out;
}

function failuresBlock() {
  const rows = failureRows();
  // A clean run should not spend a panel on an empty list.
  if (!rows.length) return "";
  const shown = rows.slice(0, 12);
  const list = shown.map(({ doc, e }) => {
    const [label, cls] = VERDICT[e.verdict] || ["?", "warn"];
    return `<button class="fail-row" data-doc="${esc(doc.doc_id)}">
      <span class="dot ${cls === "bad" ? "bad" : "warn"}"></span>
      <span class="who">
        <span class="doc mono">${esc(shortId(doc.doc_id))}</span>
        <span class="what">${esc(e.clause.replace(/_/g, " "))}${e.found ? ` — “${esc((e.claim || "").slice(0, 60))}…”` : ""}</span>
      </span>
      <span class="v ${cls}">${esc(label)}</span>
    </button>`;
  }).join("");
  return `<details class="fold">
    <summary>Problems · ${rows.length} field${rows.length === 1 ? "" : "s"}</summary>
    <div class="fold-body">
      <div class="fail-list" id="failList">${list}</div>
      <p class="note">${rows.length} field${rows.length === 1 ? "" : "s"} wrong${rows.length > shown.length ? ` · showing ${shown.length}` : ""}.
        Click one to open that document; the quote and its excerpt are on the card.</p>
    </div>
  </details>`;
}

function renderSide() {
  const { metrics, report, medians_ms: medians } = S.data;
  const e = metrics.extraction;
  const base = metrics.majority_risk_baseline;
  const risk = metrics.risk_accuracy;
  const docsCorrect = metrics.docs_fully_correct;
  const docs = S.data.meta.docs;

  const accPct = risk == null ? 0 : risk * 100;
  const basePct = base == null ? 0 : base * 100;
  const baseLevel = metrics.majority_risk_level || "most common level";
  const baseNote = `always answering “${esc(baseLevel)}”`
    + (metrics.majority_risk_count ? ` (${metrics.majority_risk_count} of ${docs})` : "");
  const vsBase = (risk != null && base != null)
    ? (risk >= base ? `above baseline: ${baseNote}` : `below baseline: ${baseNote}`)
    : "";

  let reportBlock = `<p class="note">No report record in this run, so the aggregate is unscored.</p>`;
  if (report) {
    const checks = report.checks || {};
    const rows = [
      checkRow("Documents counted", checks.documents,
        `predicted ${esc(report.predicted?.documents ?? "—")} · expected ${esc(report.expected?.documents ?? "—")}`),
      countsRow("Risk counts", checks.risk_counts, report.predicted?.risk_counts,
        report.expected?.risk_counts, ["high", "medium", "low"]),
      countsRow("Governing law", checks.governing_law_counts,
        report.predicted_governing_law_counts, report.expected?.governing_law_counts),
      checkRow("Highest-risk reference", checks.highest_risk_ref,
        `predicted ${esc(shortId(report.predicted?.highest_risk_ref))} · one of ${esc(report.expected?.high_risk_count ?? "—")} high-risk documents`),
    ];
    if ("missing_data_protection" in checks) {
      rows.push(checkRow("Missing data protection", checks.missing_data_protection,
        `predicted ${esc(report.predicted?.missing_data_protection ?? "—")} · expected ${esc(report.expected?.missing_data_protection ?? "—")}`));
    }
    reportBlock = `<div class="check-list">${rows.join("")}</div>
      <p class="note">These checks score the one report call's own aggregate tally. They are separate
        from the per-document tiles: a counting error here does not change extraction F1, risk
        accuracy or the fully-correct count above.</p>`;
  }

  $("#side").innerHTML = `
    <h2>Run scoreboard</h2>
    <details class="read">
      <summary>What these numbers mean</summary>
      <p><b>Ground truth</b> is the answer key: the CUAD expert annotations in
        <span class="mono">ground_truth.json</span>. “Truth” on this page always means that file,
        not a lawyer's opinion. An empty category means “CUAD did not annotate one”, which is
        weaker than “the contract has none”.</p>
      <p><b>Extraction F1</b> is one number for the four clause fields, combining how many of the
        model's quotes the annotation supports (<i>precision</i>) with how many annotated clauses
        it found (<i>recall</i>); 1.000 is every field right. <b>Containment</b> is how a quote
        counts as matching: the quote and the annotation must contain one another after
        normalisation, so a correct paraphrase still fails.</p>
      <p><b>Risk accuracy</b> is the share of documents whose risk level matches the rubric
        applied to the annotated clauses. The <b>baseline</b> is always answering the most common
        level, so the bar to clear is that number, not zero.</p>
      <p><b>Report</b> scores cross-document checks (document count, risk counts, governing law,
        highest-risk reference) as a blended percentage. <b>Fully correct</b> means every scored
        field in that one document passed.</p>
      <p><b>The matrix</b> in the guide is a confusion matrix: it counts, for each annotated risk
        level, what the model answered instead. The shaded diagonal is where the two agree.</p>
    </details>
    <div class="tiles">
      <div class="tile">
        <div class="lab">Extraction F1</div>
        <div class="val">${e.f1.toFixed(3)}</div>
        <div class="sub">P ${e.precision.toFixed(3)} · R ${e.recall.toFixed(3)} · containment<br>${e.fields_correct}/${e.fields_total} fields</div>
      </div>
      <div class="tile">
        <div class="lab">Risk accuracy</div>
        <div class="val">${risk == null ? "—" : risk.toFixed(3)} <small>vs ${base == null ? "—" : base.toFixed(3)}</small></div>
        <div class="bar" title="Bar = accuracy; line = always answering '${esc(baseLevel)}'">
          <span style="width:${accPct}%"></span><i style="left:${basePct}%"></i>
        </div>
        <div class="sub">${vsBase}</div>
      </div>
      <div class="tile">
        <div class="lab">Report</div>
        <div class="val">${report ? pct(report.score) : "—"}</div>
        <div class="sub">${report ? `${Object.values(report.checks || {}).filter((v) => v >= 0.999).length}/${Object.keys(report.checks || {}).length} fields exact` : "not scored"}</div>
      </div>
      <div class="tile">
        <div class="lab">Documents</div>
        <div class="val">${docsCorrect}<small>/${docs}</small></div>
        <div class="sub">every field correct<br>${metrics.type_accuracy == null ? "" : `type acc ${metrics.type_accuracy.toFixed(3)}`}</div>
      </div>
    </div>

    ${failuresBlock()}
    ${routingBlock()}

    <details class="fold">
      <summary>Run detail</summary>
      <div class="fold-body">
        <h2>Report field-by-field</h2>
        ${reportBlock}

        <h2 style="margin-top:18px">Stage latency (median)</h2>
        <div class="check-list">
          ${Object.entries(medians).sort((a, b) => medRank(a[0]) - medRank(b[0]))
            .map(([k, v]) => `<div class="check" style="flex-direction:row;align-items:center;gap:8px">
            <span style="font-size:11.5px" class="mono">${esc(k)}</span>
            <span style="margin-left:auto;font-size:11px;color:var(--muted)" class="mono">${ms(v)}</span>
          </div>`).join("") || `<div class="check"><span class="detail">No latencies recorded.</span></div>`}
        </div>
        <p class="note">Batch-run latencies, one document per chain. A single-document live run sends classify and all extracts together, so it costs two round trips rather than six. Pool device-time and the concurrency sweep live on the telemetry page.</p>
      </div>
    </details>
  `;

  $$("#failList .fail-row").forEach((el) => {
    el.addEventListener("click", () => {
      S.current = el.dataset.doc;
      renderRail();

    });
  });
}

function checkRow(label, value, detail) {
  const ok = value != null ? value >= 0.999 : null;
  const ico = ok === null ? "–" : ok ? "✓" : "✗";
  const cls = ok === null ? "" : ok ? "ok" : "bad";
  return `<div class="check">
    <div class="check-top"><span class="ico ${cls}">${ico}</span><span>${esc(label)}</span>
      <span class="val">${value == null ? "—" : value >= 0.999 ? "exact" : "mismatch"}</span></div>
    <div class="detail">${detail}</div>
  </div>`;
}

function countsRow(label, value, predicted, expected, order) {
  const ok = value != null ? value >= 0.999 : null;
  const ico = ok === null ? "–" : ok ? "✓" : "✗";
  const cls = ok === null ? "" : ok ? "ok" : "bad";
  const keys = order
    || [...new Set([...Object.keys(predicted || {}), ...Object.keys(expected || {})])].sort();
  const chips = keys.slice(0, 8).map((k) => {
    const got = predicted?.[k] ?? 0;
    const want = expected?.[k] ?? 0;
    const bad = Number(got) !== Number(want);
    const label = k.length > 26 ? k.slice(0, 24) + "…" : k;
    return `<span class="count ${bad ? "bad" : ""}" title="${esc(k)}: predicted ${esc(got)}, expected ${esc(want)}">
      ${esc(label)} <b>${esc(got)}</b>/${esc(want)}</span>`;
  }).join("");
  const extra = keys.length > 8 ? `<span class="count">+${keys.length - 8}</span>` : "";
  return `<div class="check">
    <div class="check-top"><span class="ico ${cls}">${ico}</span><span>${esc(label)}</span>
      <span class="val">${value == null ? "—" : Math.round(value * 100) + "% count match"}</span></div>
    <div class="counts">${chips}${extra}</div>
  </div>`;
}

  ta.addEventListener("input", () => {

  });

  const status = () => $("#liveStatus");
  const showPending = (files) => {
    $("#pendingList").innerHTML = `
      <div class="corpus-list">${files.map((f) => `<div class="corpus-row">

      <p class="note">${files.length} documents queued. The run keeps two in flight and
        reports each as it lands.</p>`;
    hint.textContent = `${files.length} documents ready — press Run`;
  };

  const takeFiles = async (list) => {
    const files = [...list];
    if (!files.length) return;
    const archive = files.find((f) =>
      /\.(zip|tar|tar\.gz|tgz|tar\.bz2|tar\.xz)$/i.test(f.name));
    if (archive) {
      // An archive goes up as bytes: unpacking belongs on the server, where
      // the caps and the path checks are, not in the page.
      try {
        const buf = await archive.arrayBuffer();
        S.pending = { kind: "archive", name: archive.name, data: toBase64(buf) };
        S.draft = "";
        ta.value = "";
        $("#pendingList").innerHTML = `
          <div class="corpus-list"><div class="corpus-row">
            <span class="dot ok"></span><span class="name mono">${esc(archive.name)}</span>
            <span class="state">${(buf.byteLength / 1024).toFixed(0)} KiB</span></div></div>
          <p class="note">The server unpacks the text members, applies the caps, and reports
            what it skipped. Nothing is written to disk.</p>`;
        hint.textContent = "archive ready — press Run";
      } catch {
        status().className = "err";
        status().textContent = `could not read ${archive.name}`;
      }
      return;
    }
    const textFiles = files.filter((f) => /\.(txt|md|markdown|text)$/i.test(f.name)
      || (f.type || "").startsWith("text/"));
    if (!textFiles.length) {
      status().className = "err";
      status().textContent = "none of those files is plain text — PDF/DOCX ingestion is not built yet.";
      return;

    try {
      const docs = await Promise.all(textFiles.map(async (f) => ({
        name: f.name, text: await f.text() })));

      ta.value = "";

      showPending(docs);

      status().className = "err";
      status().textContent = "could not read one of those files";
    }
  };

  $("#fileBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => takeFiles(fileInput.files));
  box.addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("dragover"); });
  box.addEventListener("dragleave", () => box.classList.remove("dragover"));
  box.addEventListener("drop", (e) => {
    e.preventDefault();
    box.classList.remove("dragover");
    takeFiles(e.dataTransfer?.files || []);
  });
  $("#submitBtn").addEventListener("click", submitDocument);
}

function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

// Progress for a corpus run: one row per document, updated as stages land.
