[project]
name = "hybrid-demo"
version = "0.1.0"
description = "Contract-review demo on hybrid CPU+GPU inference: pipeline, simulated pools, trace UI, measurement"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
# The base install intentionally excludes torch/transformers: the demo's
# simulated stack and tests run without them. The specialist pool and the
# CUAD validators need this extra (or Dockerfile.specialist).
specialist = [
    "torch>=2.2,<3",
    "transformers>=4.40,<6",
    "sentencepiece>=0.1.99,<1",
    "protobuf>=4.25,<7",
]
retrieval = [
    "sentence-transformers>=2.7,<6",
    "torch>=2.2,<3",
    "transformers>=4.40,<6",
]
# Optional OSS adapters. None of these are on the measured default path; each
# one is a swap that must be A/B tested (see docs/OPENSOURCE-REUSE.md).
pii = [
    "presidio-analyzer>=2.2,<3",
]
spans = [
    "nervaluate>=0.2,<2",
]
stats = [
    "statsmodels>=0.14,<1",
]
ranking = [
    "ranx>=0.3,<1",
]
sparse = [
    "bm25s>=0.2,<1",
]
ingest = [
    "docling>=2.0,<3",
    "docling-core>=2.0,<3",
    "transformers>=4.40,<6",
]
cache = [
    "redis>=5.0,<7",
    "redisvl>=0.3,<1",
]
otel = [
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]
rag = [
    "ragas>=0.2,<1",
    "datasets>=2.20,<5",
]
# MCP facade (design §3.5). Additive: the measured pipeline does not import
# this extra, and the server only calls the governed ingress relays.
mcp = [
    "mcp>=1.0,<2",
]

[project.scripts]
hybrid-gendata = "hybrid_demo.pipeline.generate:main"
hybrid-review = "hybrid_demo.pipeline.review:main"
hybrid-direct-arm = "hybrid_demo.pipeline.direct:main"
hybrid-run = "hybrid_demo.pipeline.run:main"
hybrid-score = "hybrid_demo.evalkit.score:main"
hybrid-pii-agreement = "hybrid_demo.evalkit.pii_agreement:main"
hybrid-pool = "hybrid_demo.fakepool.server:main"
hybrid-traceui = "hybrid_demo.traceui.server:main"
hybrid-ui = "hybrid_demo.ui.server:main"
hybrid-specialist = "hybrid_demo.specialist.server:main"
hybrid-retrieval-eval = "hybrid_demo.retrieval.evaluate:main"
hybrid-retrieval-e2e = "hybrid_demo.retrieval.endtoend:main"
hybrid-pool-sim = "hybrid_demo.fakepool.llmd_sim:main"
hybrid-index = "hybrid_demo.retrieval.index:main"
hybrid-bench = "hybrid_demo.bench:main"
hybrid-batch = "hybrid_demo.pipeline.batch:main"
hybrid-pii = "hybrid_demo.pii:main"
hybrid-eval-contract-steps = "hybrid_demo.evalkit.contract_steps:main"
hybrid-mcp = "hybrid_demo.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.5,<1",
    # Tiny, pure-Python; keeps the offset-scoring adapter exercised in CI.
    "nervaluate>=0.2,<2",
    # Test-only: the praxis stub and conftest parse the real routing configs.
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The trace UI keeps its whole page (CSS+JS) in one PAGE string, like upstream.
"src/hybrid_demo/traceui/server.py" = ["E501"]
