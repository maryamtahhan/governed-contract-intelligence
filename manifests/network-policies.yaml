# In-cluster pinning for the model pools (the V15 enforcement layer): the
# predictors accept traffic only from the trace-ui relays and praxis, so a
# sensitive request cannot bypass the gateway topology, and nothing outside
# the namespace can reach the models directly. Egress stays open for the
# initial Hugging Face model download; tighten once models are cached.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-pools-ingress
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trace-ui
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-pools-egress
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
