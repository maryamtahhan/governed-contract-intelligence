# Arm C - hybrid CPU+GPU with naive round-robin and no classifier: every
# request alternates across the CPU and GPU pools regardless of difficulty or
# sensitivity. Shown to be worse on both cost (hard steps land on the small
# CPU model) and governance (sensitive work can land on the general GPU pool).
insecure_options:
  allow_private_upstreams: true

admin:
  address: "127.0.0.1:9901"
  metrics_address: "0.0.0.0:9902"

clusters:
  - name: vllm-any
    endpoints: ["trace-ui:8081", "trace-ui:8082"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2

runtime:
  subrequest_circuit_breaker:
    consecutive_failures: 3
    recovery_window_secs: 30
    half_open_timeout_secs: 15

listeners:
  - name: ai-gateway
    address: "0.0.0.0:8080"
    filter_chains:
      - inference-routing

filter_chains:
  - name: inference-routing
    filters:
      - filter: request_id
      - filter: access_log
      - filter: static_response
        conditions:
          - when:
              path: "/v1/models"
              methods: ["GET"]
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: >-
          {"object":"list","data":[{"id":"Semantic-Qwen","object":"model","created":0,"owned_by":"praxis"}]}
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: vllm-any
      - filter: load_balancer
        clusters:
          - name: vllm-any
            endpoints: ["trace-ui:8081", "trace-ui:8082"]
