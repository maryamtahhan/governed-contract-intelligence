apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openshell-demo

# Full base: the platform half (manifests/base/, also consumable on its own by
# stacks without KServe) plus the KServe InferenceService/ServingRuntime
# objects. `oc apply -k manifests` on a cluster with RHOAI/KServe installed
# produces the same object set as before the split.
resources:
  - base
  - vllm-cpu-runtime.yaml
  - vllm-cpu-inferenceservice.yaml
  - vllm-gpu-servingruntime.yaml
  - vllm-gpu-inferenceservice.yaml
  - vllm-gpu-approved-inferenceservice.yaml
  - vllm-gpu-small-inferenceservice.yaml
