# The semantic classifier (llm-d-sc): gRPC on 50051, model delivered by a
# ModelCar init container. Adopted from RMalone8/llm-d-sc-demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-sc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-sc
        app.kubernetes.io/component: semantic-classifier
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: modelcar
          image: quay.io/rmalone/llm-d-sc-modelcar:complexity
          command: ["/bin/sh", "-c", "cp -R /models/. /shared/"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: model
              mountPath: /shared
      containers:
        - name: llm-d-sc
          image: quay.io/rmalone/llm-d-sc:v0.1.0
          env:
            - name: LLM_D_SC_MODEL_DIR
              value: /models
            - name: LLM_D_SC_CLASSIFIER
              value: complexity
            - name: LLM_D_SC_LISTEN
              value: "0.0.0.0:50051"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          # TCP readiness, not the standard gRPC health probe: upstream main
          # serves grpc.health.v1 (PR #42, 2026-10-08), but the pinned
          # v0.1.0 image was built from the release tag, which predates it
          # and contains no health service. A `grpc:` probe against this
          # image fails and the pod never becomes Ready. The process logs
          # "READY (resident Candle classifier loaded and warmed)"; that log
          # is not exposed as a probe. Re-check the image before changing
          # this to grpc. Until then, praxis's llm_d_sc 500 ms timeout with
          # `default_cluster` is what protects a request that arrives before
          # the model is warm (FINDINGS §7).
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-sc
spec:
  selector:
    app.kubernetes.io/name: llm-d-sc
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
