# The semantic classifier (llm-d-sc): gRPC on 50051, model delivered by a
# ModelCar init container. Adopted from RMalone8/llm-d-sc-demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-sc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-sc
        app.kubernetes.io/component: semantic-classifier
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: modelcar
          image: quay.io/mtahhan/gci-llm-d-sc-modelcar:complexity
          command: ["/bin/sh", "-c", "cp -R /models/. /shared/"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: model
              mountPath: /shared
      containers:
        - name: llm-d-sc
          image: quay.io/mtahhan/gci-llm-d-sc:main-e660fff
          env:
            - name: LLM_D_SC_MODEL_DIR
              value: /models
            - name: LLM_D_SC_CLASSIFIER
              value: complexity
            - name: LLM_D_SC_LISTEN
              value: "0.0.0.0:50051"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          # gRPC readiness (standard grpc.health.v1, upstream PR #42): the
          # pinned upstream e660fff binds the gRPC listener only after the
          # resident classifier is loaded and warmed, and the health service
          # reports SERVING from that point — so a passing probe means a warm
          # model and a live gRPC stack, not just a bound socket. The previous
          # v0.1.0 image predates the health service and needed a TCP probe.
          readinessProbe:
            grpc:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-sc
spec:
  selector:
    app.kubernetes.io/name: llm-d-sc
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
