# Background traffic the trace UI's "Simulate Traffic" button scales 0<->1.
# Stays at replicas: 0 in git (same rule as RMalone8/llm-d-sc-demo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-traffic-gen
spec:
  replicas: 0
  selector:
    matchLabels:
      app: praxis-traffic-gen
  template:
    metadata:
      labels:
        app: praxis-traffic-gen
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: gen
          image: quay.io/rmalone/praxis-trace-ui:v0.2.0
          env:
            - name: TARGET
              value: http://trace-ui:8080/v1/chat/completions
            - name: INTERVAL
              value: "5"
            # The gateway's PPE policy layer fails closed on keyless
            # requests, so the generator presents the eval key (digest in
            # manifests/base/praxis/api-keys.yaml). Without it every request
            # 401s at the gate and "Simulate Traffic" looks dead.
            - name: X_API_KEY
              value: gci-demo-key-eval
          command:
            - python3
            - -u
            - -c
            - |
                import json, os, random, signal, time, urllib.request, urllib.error
                signal.signal(signal.SIGTERM, lambda *_: os._exit(0))
                URL = os.environ["TARGET"]
                INTERVAL = float(os.environ["INTERVAL"])
                # Contract-domain background traffic. Routing no longer
                # depends on prompt content (the pins landed; the classifier
                # era's generic SIMPLE/REASONING prompts are gone), so the
                # two lists are just short-extraction vs judgment-flavored
                # filler that matches the pipeline's step vocabulary.
                SIMPLE = [
                    "Classify the following contract by type and state its initial term.",
                    "Extract the termination clause from the following contract. If the clause is absent, say not found.",
                    "Extract the governing law clause from the following contract.",
                    "Extract the liability cap clause from the following contract.",
                    "Classify this agreement: MSA, NDA, SOW or DPA, and state the initial term in months.",
                    "Does this contract contain a data protection clause?",
                ]
                REASONING = [
                    "Assess the aggregate risk exposure across these contracts and rank them by severity.",
                    "Judge this contract's exposure given its termination, liability and data-protection clauses, and justify the rating.",
                    "Produce the cross-document risk report across all 12 documents. Synthesise and compare the extractions, derive the aggregate counts, and prove the ranking.",
                    "Compare the liability caps across the portfolio and identify the outliers with reasons.",
                    "Derive the portfolio-level compliance posture from the extracted clauses and defend each conclusion.",
                ]
                n = 0
                while True:
                    started = time.time()
                    n += 1
                    kind = random.choice(["simple", "reasoning"])
                    prompt = random.choice(SIMPLE if kind == "simple" else REASONING)
                    body = json.dumps({
                        "model": "Semantic-Qwen",
                        "messages": [{"role": "user", "content": prompt}],
                        "max_tokens": 24,
                    }).encode()
                    req = urllib.request.Request(URL, data=body, headers={
                        "Content-Type": "application/json",
                        "X-API-Key": os.environ["X_API_KEY"],
                    })
                    hdrs = {}
                    try:
                        with urllib.request.urlopen(req, timeout=120) as r:
                            r.read()
                            status, hdrs = r.status, r.headers
                    except urllib.error.HTTPError as e:
                        status, hdrs = e.code, e.headers
                    except Exception as e:
                        status = type(e).__name__
                    route = hdrs.get("X-Demo-Route", "-") if hdrs else "-"
                    label = hdrs.get("X-Demo-Classification", "-") if hdrs else "-"
                    ms = int((time.time() - started) * 1000)
                    print(f"#{n} sent={kind:9} got={route} label={label} status={status} {ms}ms | {prompt[:55]}", flush=True)
                    time.sleep(max(0.0, INTERVAL - (time.time() - started)))
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
