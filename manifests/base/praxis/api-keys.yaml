# API-key directory for the gateway's policy layer (PPE identity/api-key,
# manifests/base/praxis/policy.yaml). SHA-256 digests only — never plaintext.
#
# These are fixed demo credentials, not secrets: they exist so the policy
# filter can attribute every request to a caller (pipeline step, eval
# harness). The plaintext values live in demo/src/hybrid_demo/common.py
# (DEMO_API_KEYS) so the runner sends the matching key per step; rotate by
# changing both sides together. High-entropy keys would matter only if this
# file could leak somewhere the plaintext cannot — for the demo, attribution
# is the point, not secrecy.
#
# groups map to roles through the plugin's record_map (role.<group>).
keys:
  - hash: "sha256:895b459a009d54fe45cb392238adbaa34b779f935bd5cc6748fa5b4a134999c4"
    user: gci-classify
    groups: [pipeline]
  - hash: "sha256:4c0f66651b4155e1d6d53d219536eeccde6169eb299c159d4bc3b4fc0bc56e20"
    user: gci-extract
    groups: [pipeline]
  - hash: "sha256:1da330ebb40a40fe3fe456ab7331f1979162c5de61c901517bb471e6d3a9463b"
    user: gci-risk
