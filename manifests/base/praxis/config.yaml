# Arm D - the full hybrid stack (default config).
#
# Four listeners implement the plan's routing matrix. None of them consults
# a classifier: llm-d-sc was removed from the stack on 2026-11-05 because
# the measured runs showed it labels every per-document step MEDIUM (FINDINGS
# §15.5) — the routing that actually happened is expressed directly here.
#   - general (:8080):  pinned CPU-first. On failure, fail over to any
#     general pool with X-Praxis-Fallback: true (the visible "degraded"
#     flag).
#   - sensitive (:8083): the pipeline's PII screen sends documents containing
#     personal data here. Also pinned CPU-first, but its failover pool
#     contains ONLY the approved in-cluster GPU backend, so when that pool
#     is down the request fails closed with an explicit error instead of
#     spilling to a non-approved pool.
#   - judgment (:8086) and sensitive-judgment (:8087): stage-aware policy
#     routing for the judgment steps (risk + report). They are pinned to the
#     GPU with no CPU failover: judgment is the work worth a GPU, and a
#     rerun must not silently reproduce the all-CPU result. The sensitive
#     judgment entry pins to the approved GPU only, so it fails closed if
#     that pool is down.
#
# Structure follows the proven config in RMalone8/llm-d-sc-demo: Praxis
# reaches the predictors only through the trace-ui relays (per-pool
# recording hops) and health checks are per cluster. The gateway image is
# the fork that carries the llm_d_sc filter (deploy/images/praxis-llm-d-sc/)
# — the filter is unused by this config but stays in the image for the
# contract-step taxonomy experiment (docs/design.md).
insecure_options:
  allow_private_upstreams: true

admin:
  address: "127.0.0.1:9901"
  metrics_address: "0.0.0.0:9902"

clusters:
  - name: vllm-cpu
    endpoints: ["trace-ui:8081"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2
  - name: vllm-gpu
    endpoints: ["trace-ui:8082"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2
  - name: vllm-gpu-approved
    endpoints: ["trace-ui:8084"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2
  - name: vllm-gpu-small
    endpoints: ["trace-ui:8085"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2
  - name: vllm-any
    endpoints: ["trace-ui:8081", "trace-ui:8082"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2
  - name: vllm-approved-only
    endpoints: ["trace-ui:8084"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2

runtime:
  subrequest_circuit_breaker:
    consecutive_failures: 3
    recovery_window_secs: 30
    half_open_timeout_secs: 15

listeners:
  - name: ai-gateway
    address: "0.0.0.0:8080"
    filter_chains:
      - inference-routing
  - name: sensitive-gateway
    address: "0.0.0.0:8083"
    filter_chains:
      - sensitive-routing
  - name: judgment-gateway
    address: "0.0.0.0:8086"
    filter_chains:
      - judgment-routing
  - name: sensitive-judgment-gateway
    address: "0.0.0.0:8087"
    filter_chains:
      - sensitive-judgment-routing

filter_chains:
  - name: inference-routing
    filters:
      - filter: request_id
      - filter: access_log
      - filter: static_response
        conditions:
          - when:
              path: "/v1/models"
              methods: ["GET"]
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: >-
          {"object":"list","data":[{"id":"Semantic-Qwen","object":"model","created":0,"owned_by":"praxis"}]}
      - filter: iterative_request_router
        initial_step: route
        max_iterations: 3
        timeout_ms: 300000
        step_timeout_ms: 120000
        steps:
          # CPU-first pin, no classifier. The measured ROSA run showed
          # llm-d-sc labelled 1,200 of 1,201 steps MEDIUM -> CPU (FINDINGS
          # §15.5), so this pin reproduces the recorded routing without the
          # gRPC classification hop. Judgment and cross-document report work
          # goes to the :8086/:8087 entries by stage, not by label.
          - name: route
            filters:
              - filter: router
                routes:
                  - path_prefix: "/"
                    cluster: vllm-cpu
              - filter: load_balancer
                clusters:
                  - name: vllm-cpu
                    endpoints: ["trace-ui:8081"]
            on_result:
              - origin: transport
                next: failover
              - status: [429, 500, 502, 503, 504]
                next: failover
              - default: true
                done: true
          - name: failover
            filters:
              - filter: headers
                request_set:
                  - name: Content-Type
                    value: application/json
                response_add:
                  - name: X-Praxis-Fallback
                    value: "true"
              - filter: router
                routes:
                  - path_prefix: "/"
                    cluster: vllm-any
              - filter: load_balancer
                clusters:
                  - name: vllm-any
                    endpoints: ["trace-ui:8081", "trace-ui:8082"]
            on_result:
              - default: true
                done: true

  - name: sensitive-routing
    filters:
      - filter: request_id
      - filter: access_log
      - filter: static_response
        conditions:
          - when:
              path: "/v1/models"
              methods: ["GET"]
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: >-
          {"object":"list","data":[{"id":"Semantic-Qwen","object":"model","created":0,"owned_by":"praxis"}]}
      - filter: iterative_request_router
        initial_step: route
        max_iterations: 3
        timeout_ms: 300000
        step_timeout_ms: 120000
        steps:
          # CPU-first pin for sensitive documents, no classifier (same
          # reasoning as the general entry). What makes this entry sensitive
          # is the failover set below: only the approved GPU pool, so a
          # request never spills to a pool outside the approved set.
          - name: route
            filters:
              - filter: router
                routes:
                  - path_prefix: "/"
                    cluster: vllm-cpu
              - filter: load_balancer
                clusters:
                  - name: vllm-cpu
                    endpoints: ["trace-ui:8081"]
            on_result:
              - origin: transport
                next: failover
              - status: [429, 500, 502, 503, 504]
                next: failover
              - default: true
                done: true
          # Failover for the sensitive entry is restricted to the approved GPU
          # pool on purpose: a request fails closed when that pool is down
          # rather than degrading onto a pool not approved for sensitive
          # data. (A request whose CPU pool died lands on the approved GPU
          # pool, which is also within the allowed set.)
          - name: failover
            filters:
              - filter: headers
                request_set:
                  - name: Content-Type
                    value: application/json
                response_add:
                  - name: X-Praxis-Fallback
                    value: "true"
              - filter: router
                routes:
                  - path_prefix: "/"
                    cluster: vllm-approved-only
              - filter: load_balancer
                clusters:
                  - name: vllm-approved-only
                    endpoints: ["trace-ui:8084"]
            on_result:
              - default: true
                done: true

  # Judgment entries: no CPU fallback. The pipeline sends risk
  # and the cross-document report here by step type, not by model confidence.
  - name: judgment-routing
    filters:
      - filter: request_id
      - filter: access_log
      - filter: static_response
        conditions:
          - when:
              path: "/v1/models"
              methods: ["GET"]
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: >-
          {"object":"list","data":[{"id":"Semantic-Qwen","object":"model","created":0,"owned_by":"praxis"}]}
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: vllm-gpu
      - filter: load_balancer
        clusters:
          - name: vllm-gpu
            endpoints: ["trace-ui:8082"]

  # Sensitive judgment pins to the approved pool only. There is deliberately
  # no failover step: when the approved GPU pool is down the request fails
  # closed instead of spilling to a pool not approved for personal data.
  - name: sensitive-judgment-routing
    filters:
      - filter: request_id
      - filter: access_log
      - filter: static_response
        conditions:
          - when:
              path: "/v1/models"
              methods: ["GET"]
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: >-
          {"object":"list","data":[{"id":"Semantic-Qwen","object":"model","created":0,"owned_by":"praxis"}]}
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: vllm-gpu-approved
      - filter: load_balancer
        clusters:
          - name: vllm-gpu-approved
            endpoints: ["trace-ui:8084"]
