# Arm B - the skeptic's baseline: all-GPU, with the small GPU model serving
# the per-document steps (V18). Historically this was llm-d-sc label routing
# (SIMPLE/MEDIUM -> small pool, COMPLEX/REASONING -> big pool), but the
# classifier labelled 1,200 of 1,201 steps MEDIUM (FINDINGS §15.5), so the
# measured routing was "everything on the small pool" - which this pin
# reproduces without the classifier. If the small model handles the work as
# well as the CPU pool does, the CPU story has to win on cost alone.
insecure_options:
  allow_private_upstreams: true

admin:
  address: "127.0.0.1:9901"
  metrics_address: "0.0.0.0:9902"

clusters:
  - name: vllm-gpu
    endpoints: ["trace-ui:8082"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2
  - name: vllm-gpu-small
    endpoints: ["trace-ui:8085"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2
  - name: vllm-gpu-any
    endpoints: ["trace-ui:8082", "trace-ui:8085"]
    health_check:
      type: http
      path: /health
      expected_status: 200
      interval_ms: 5000
      timeout_ms: 2000
      healthy_threshold: 2
      unhealthy_threshold: 2

runtime:
  subrequest_circuit_breaker:
    consecutive_failures: 3
    recovery_window_secs: 30
    half_open_timeout_secs: 15

listeners:
  - name: ai-gateway
    address: "0.0.0.0:8080"
    filter_chains:
      - inference-routing

filter_chains:
  - name: inference-routing
    filters:
      - filter: request_id
      - filter: access_log
      - filter: static_response
        conditions:
          - when:
              path: "/v1/models"
              methods: ["GET"]
        status: 200
        headers:
          - name: Content-Type
            value: application/json
        body: >-
          {"object":"list","data":[{"id":"Semantic-Qwen","object":"model","created":0,"owned_by":"praxis"}]}
      - filter: iterative_request_router
        initial_step: route
        max_iterations: 3
        timeout_ms: 300000
        step_timeout_ms: 120000
        steps:
          # Pin to the small GPU pool - see the header comment. Failover
          # spreads across both GPU pools with the visible degraded flag.
          - name: route
            filters:
              - filter: router
                routes:
                  - path_prefix: "/"
                    cluster: vllm-gpu-small
              - filter: load_balancer
                clusters:
                  - name: vllm-gpu-small
                    endpoints: ["trace-ui:8085"]
            on_result:
              - origin: transport
                next: failover
              - status: [429, 500, 502, 503, 504]
                next: failover
              - default: true
                done: true
          - name: failover
            filters:
              - filter: headers
                request_set:
                  - name: Content-Type
                    value: application/json
                response_add:
                  - name: X-Praxis-Fallback
                    value: "true"
              - filter: router
                routes:
                  - path_prefix: "/"
                    cluster: vllm-gpu-any
              - filter: load_balancer
                clusters:
                  - name: vllm-gpu-any
                    endpoints: ["trace-ui:8082", "trace-ui:8085"]
            on_result:
              - default: true
                done: true
