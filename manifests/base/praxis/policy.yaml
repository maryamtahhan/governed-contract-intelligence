# PPE policy document for the general and judgment gateway entries
# (listeners :8080 and :8086 in manifests/base/praxis/config.yaml, and the
# single entry of arms A/B/C).
#
# Phase 1 of the PPE integration (docs/design.md and the integration plan):
# per-step identity and a fail-closed authentication gate. Every inference
# request must present a known X-API-Key (digests in api-keys.yaml); the
# runner sends one key per pipeline step, so each decision record attributes
# the request to classify / extract / risk / report. The model must be the
# one this stack serves — an unknown model fails closed.
#
# What this policy deliberately does NOT do:
#   - pool steering: PPE's restrict effect is not consumed by the praxis
#     router (no backend labels, one served-model name), so which pool may
#     serve a request stays expressed by the entry pinning in the praxis
#     configs. Do not claim policy-driven routing.
#   - sensitivity: the sensitive entries (:8083/:8087) load
#     policy-sensitive.yaml, which additionally taints the session.
#   - llm.input.* predicates: praxis does not yet populate the normalized
#     request parts (praxis-proxy/praxis#1429); rules keyed on them would
#     deny every request through the documented missing-key guard.
plugins:
  - name: api-keys
    kind: identity/api-key
    hooks: [identity.resolve]
    on_error: fail
    config:
      credential:
        kind: header
        name: X-API-Key
      provider:
        kind: file
        path: /etc/praxis/api-keys.yaml
        refresh_secs: 30
        max_staleness_secs: 300
      record_map:
        subject:
          id: user
          roles: groups

  # Decision records (image v0.9.1+): one JSON line per verdict — allow,
  # deny, modify — including which route ruled and the identity that asked.
  # Lists no hooks, which is what attaches it as a sink. destination:
  # stderr lands in the container logs (docker compose logs praxis / oc
  # logs deploy/praxis); the run harness captures them for the audit trail
  # alongside trace-ui's SQLite.
  - name: audit
    kind: audit/logger
    mode: audit
    capabilities:
      - read_subject
      - read_client
      - read_labels
    config:
      destination: stderr
      source: gci-gateway

  # Shadow PII screen (V19 groundwork): the gateway-side scanner, run in
  # observe mode. It NEVER denies and NEVER rewrites — it logs one
  # structured line per scanned request (session, subject, matched entity
  # names), keyed for hybrid-pii-agreement to join against the pipeline's
  # client-side screen (demo/src/hybrid_demo/pii.py). The pattern catalog
  # mirrors that screen regex-for-regex. Promoting this to a gate is a
  # measured decision for a later run, not a config flip.
  - name: pii-observe
    kind: validator/gci-pii-observe
    mode: audit
    hooks: [cmf.llm_input]
    capabilities:
      - read_agent
      - read_subject

global:
  authentication: [api-keys]
  authorization:
    pre_invocation:
      - "require(authenticated)"

routes:
  - llm: Semantic-Qwen
    authorization:
      pre_invocation:
        - "require(authenticated)"
