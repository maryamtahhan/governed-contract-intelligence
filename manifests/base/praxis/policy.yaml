# PPE policy document for the general gateway entry (listener :8080 in
# manifests/base/praxis/config.yaml, and the single entry of arms A/B/C).
# The sensitive entry (:8083) uses policy-sensitive.yaml; the pre-entry PII
# screen (:8086) uses policy-screen.yaml.
#
# RC1: every inference request presents a known X-API-Key (digests in
# api-keys.yaml) and that key is bound to the stage in X-Demo-Step. The
# runner sends one key per pipeline step; a valid extract key cannot claim
# classify, risk, report or another stage. The model must be the one this
# stack serves — an unknown model fails closed.
#
# The general entry also runs the PII scanner in gate mode. A document that
# reaches this entry with PII is denied, so the client cannot bypass the
# pipeline's screen and put personal data on the general pool. The screen
# entry intentionally uses policy-screen.yaml, where the same scanner stays
# observe-only: screening a document must be allowed to see the document.
#
# What this policy deliberately does NOT do:
#   - pool steering: PPE's restrict effect is not consumed by the praxis
#     router (no backend labels, one served-model name), so which pool may
#     serve a request stays expressed by the router's X-Demo-Step table in
#     the praxis config. Do not claim policy-driven routing.
#   - sensitivity taint: the sensitive entry (:8083) loads
#     policy-sensitive.yaml, which additionally taints the session.
#   - llm.input.* predicates: praxis does not yet populate the normalized
#     request parts (praxis-proxy/praxis#1429); rules keyed on them would
#     deny every request through the documented missing-key guard.
plugins:
  - name: api-keys
    kind: identity/api-key
    hooks: [identity.resolve]
    on_error: fail
    config:
      credential:
        kind: header
        name: X-API-Key
      provider:
        kind: file
        path: /etc/praxis/api-keys.yaml
        refresh_secs: 30
        max_staleness_secs: 300
      record_map:
        subject:
          id: user
          roles: groups

  # Decision records (image v0.9.1+): one JSON line per recorded request
  # from PPE's reference audit/logger. On praxis-policy-core 0.4.1 the
  # hookless sink mode cannot load beside APL routes (the visitor rejects
  # any plugin no step names — fixed upstream on the 0.5.0 line as
  # policy#210), so this declaration runs it as a post-hook OBSERVER:
  # hooks + a run() step, records for allowed traffic, no verdict field.
  # When a praxis release ships PPE 0.5.x, drop the hooks and the run step
  # to get the full sink (verdict + deny records). Records land in the
  # praxis container logs alongside trace-ui's SQLite audit trail.
  - name: audit
    kind: audit/logger
    mode: audit
    hooks: [cmf.llm_input]
    capabilities:
      - read_subject
      - read_roles
      - read_client
      - read_labels
    config:
      destination: stderr
      source: gci-gateway

  # RC1 key-to-step binding. The API-key directory maps each key's groups
  # into subject.roles; the `step:<stage>` groups are the grants. A request
  # for another stage is denied before it can reach the router. The eval
  # harness is the only stepless caller: it may make a classifier call with
  # no X-Demo-Step, but an eval key that names a review step is denied too.
  - name: step-key
    kind: validator/gci-step-key
    mode: sequential
    hooks: [cmf.llm_input]
    capabilities:
      - read_headers
      - read_subject
      - read_roles
    config:
      header: X-Demo-Step
      role_prefix: "step:"
      stepless_roles: [eval]

  # RC1 PII gate for the general entry. Same pattern catalog as the
  # pipeline's client-side screen (demo/src/hybrid_demo/pii.py). A match
  # returns a 403 denial; allowed traffic still logs one structured line so
  # hybrid-pii-agreement can compare the gateway and client screens.
  - name: pii-gate
    kind: validator/gci-pii-gate
    mode: sequential
    hooks: [cmf.llm_input]
    capabilities:
      - read_agent
      - read_headers
      - read_subject

global:
  authentication: [api-keys]
  authorization:
    pre_invocation:
      - "require(authenticated)"

routes:
  - llm: Semantic-Qwen
    authorization:
      pre_invocation:
        - "require(authenticated)"
        - "run(step-key)"
        - "run(pii-gate)"
        - "run(audit)"
