# PPE policy document for the sensitive gateway entry (listener :8083 in
# manifests/base/praxis/config.yaml).
#
# Same contract as policy.yaml, plus one effect: a request that arrives on a
# sensitive entry taints its session with the `sensitive` label. Arrival here
# still means the pipeline's PII screen flagged the document — the trust
# model is unchanged from the pre-PPE stack; what is new is that the fact is
# now recorded in gateway-owned state the client cannot rewrite, and it will
# ride along on every later request for the same document session.
#
# The taint is keyed by (subject, X-Session-Id): each step key that touches
# the document gets its own label, set the first time that step passes a
# sensitive entry. Nothing denies on the taint itself yet; the Phase 2 audit
# records surface the taint diff, and any future deny rule is a measured
# decision, not an assumption. Key-to-step binding is enforced here too.
#
# Enforcing pool containment from this label would be the `restrict` effect;
# the praxis router does not consume it, so containment remains the entry's
# failover set (approved-only, fail closed) in the praxis config; the route
# table inside the entry chooses the approved pool by X-Demo-Step.
plugins:
  - name: api-keys
    kind: identity/api-key
    hooks: [identity.resolve]
    on_error: fail
    config:
      credential:
        kind: header
        name: X-API-Key
      provider:
        kind: file
        path: /etc/praxis/api-keys.yaml
        refresh_secs: 30
        max_staleness_secs: 300
      record_map:
        subject:
          id: user
          roles: groups

  # Decision records (image v0.9.1+): the reference audit sink in observer
  # mode, same as the general policy — ppe 0.4.1 cannot load a hookless
  # sink beside APL routes (policy#210, fixed on the 0.5.0 line), so it
  # runs from hooks + a run() step and records allowed traffic. The
  # read_labels capability is what surfaces the taint in records for
  # sensitive sessions — "this document is sensitive" becomes part of the
  # audit trail, not just routing behavior.
  - name: audit
    kind: audit/logger
    mode: audit
    hooks: [cmf.llm_input]
    capabilities:
      - read_subject
      - read_roles
      - read_client
      - read_labels
    config:
      destination: stderr
      source: gci-gateway

  # RC1 key-to-step binding, same stage grants as the general entry but no
  # stepless caller: a key that can reach the sensitive entry must name its
  # review stage and cannot claim another stage's route.
  - name: step-key
    kind: validator/gci-step-key
    mode: sequential
    hooks: [cmf.llm_input]
    capabilities:
      - read_headers
      - read_subject
      - read_roles
    config:
      header: X-Demo-Step
      role_prefix: "step:"
      stepless_roles: []

  # Observe-only comparison screen (V19 measurement): same pattern catalog as
  # the general policy, but wired to allow. The sensitive entry must let the
  # document through, so this scanner never denies. Its lines usually agree
  # with the screen that routed the document here — disagreement is exactly
  # what the agreement report exists to surface.
  - name: pii-observe
    kind: validator/gci-pii-observe
    mode: audit
    hooks: [cmf.llm_input]
    capabilities:
      - read_agent
      - read_headers
      - read_subject

global:
  authentication: [api-keys]
  authorization:
    pre_invocation:
      - "require(authenticated)"

routes:
  - llm: Semantic-Qwen
    authorization:
      pre_invocation:
        - "require(authenticated)"
        - "run(step-key)"
        - "taint(sensitive, session)"
        # The scanner runs after the taint so its lines for sensitive
        # sessions are attributable to a request already marked sensitive.
        - "run(pii-observe)"
        # Last, so the record sees the taint this request set.
        - "run(audit)"
