# The praxis gateway: four listeners (general :8080, sensitive :8083,
# judgment :8086, sensitive-judgment :8087), four pools
# behind the trace-ui relays, no classifier in the request path (removed
# 2026-11-05; FINDINGS §15.5). The three configs
# (config.yaml = arm D + the A/C baselines) come from deploy/linux/praxis/
# via the kustomize configMapGenerator, so the Linux stack and OpenShift run
# byte-identical routing configs. Arms are swapped with
#   oc -n openshell-demo set env deploy/praxis PRAXIS_CONFIG=/etc/praxis/arm-a.yaml
#   oc -n openshell-demo rollout status deploy/praxis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: praxis
          # Custom build: Praxis 0.7.5 / ai-gateway 0.9.0 + the out-of-tree
          # llm_d_sc filter and the PPE policy host plugins (audit sink,
          # observe-only PII scanner), published by the publish-images
          # workflow. The llm_d_sc filter is unused by the shipped configs
          # (no classifier in the request path) but stays in the image for
          # the contract-step experiment; the rebuild path is
          # deploy/images/praxis-llm-d-sc/.
          image: quay.io/mtahhan/gci-praxis:v0.9.1
          command: ["praxis-ai"]
          env:
            - name: PRAXIS_CONFIG
              value: /etc/praxis/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: sensitive
              containerPort: 8083
              protocol: TCP
            - name: judgment
              containerPort: 8086
              protocol: TCP
            - name: sensitive-judgment
              containerPort: 8087
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
            - name: metrics
              containerPort: 9902
              protocol: TCP
          # Readiness uses /healthy, not /ready: with active health checks on,
          # /ready returns 503 whenever a vLLM cluster is down, which would
          # pull the gateway out of the Service exactly when failover must
          # work. (Same note as RMalone8/llm-d-sc-demo.)
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:9902/healthy"]
            initialDelaySeconds: 3
          livenessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:9902/healthy"]
            initialDelaySeconds: 5
          resources:
            # The cpu limit matters: without it the runtime sizes its thread
            # pool from the node's CPU count (288 here) and the thread stacks
            # alone blow past the memory limit.
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "8"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: praxis-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
spec:
  selector:
    app.kubernetes.io/name: praxis
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: sensitive
      port: 8083
      targetPort: sensitive
      protocol: TCP
    - name: judgment
      port: 8086
      targetPort: judgment
      protocol: TCP
    - name: sensitive-judgment
      port: 8087
      targetPort: sensitive-judgment
      protocol: TCP
    - name: metrics
      port: 9902
      targetPort: metrics
      protocol: TCP
