# Arm B's skeptic baseline: a small model on GPU for the simple steps.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: vllm-gpu-small
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-gpu-servingruntime
      storageUri: hf://Qwen/Qwen2.5-1.5B-Instruct
      args:
        - --served-model-name=Semantic-Qwen
        - --gpu-memory-utilization=0.90
        - --max-model-len=8192
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
      resources:
        requests:
          cpu: "4"
          memory: 12Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          nvidia.com/gpu: "1"
