name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/deck/demo-deck.html"
      - "docs/diagrams/*.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages artifact
        run: |
          # Keep the source layout: the deck references ../diagrams/*.svg, so it
          # must stay one level below the diagrams on the published site too.
          mkdir -p _site/deck _site/diagrams
          cp docs/deck/demo-deck.html _site/deck/
          cp docs/diagrams/*.svg _site/diagrams/
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=deck/demo-deck.html">' \
            '<link rel="canonical" href="deck/demo-deck.html">' \
            '<title>Governed contract intelligence - demo deck</title>' \
            '<a href="deck/demo-deck.html">Open the demo deck</a>' \
            > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
