name: publish-images

on:
  workflow_dispatch:
    inputs:
      praxis:
        description: Build and push quay.io/mtahhan/gci-praxis:v0.9.0
        type: boolean
        default: true

permissions:
  contents: read

# The destination tags are fixed, so concurrent runs would race the same
# destinations. Queue instead of cancelling: a half-pushed tag is worse than
# a queued run.
concurrency:
  group: publish-images
  cancel-in-progress: false

# The classifier (gci-llm-d-sc) and its modelcar mirror were published once
# (2026-11-05, run 42043729532; digests recorded in
# deploy/images/praxis-llm-d-sc/README.md and FINDINGS §12) but are no
# longer part of the default stack — llm-d-sc was removed 2026-11-05. The
# images stay in the registry for the contract-step taxonomy experiment
# (docs/design.md §5); the jobs are gone because nothing in the
# stack consumes them. Restore them from git history (commit aa080e9) if the
# experiment needs a rebuild.
env:
  PRAXIS_IMAGE: quay.io/mtahhan/gci-praxis:v0.9.0

jobs:
  praxis:
    name: gci-praxis (gateway)
    runs-on: ubuntu-latest
    if: ${{ inputs.praxis }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Log in to quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [[ -z "$QUAY_USERNAME" || -z "$QUAY_PASSWORD" ]]; then
            echo "FATAL: set the QUAY_USERNAME and QUAY_PASSWORD repository secrets" >&2
            exit 1
          fi
          printf '%s' "$QUAY_PASSWORD" | podman login quay.io \
            --username "$QUAY_USERNAME" --password-stdin

      # Same script, pins, and self-validating Containerfile as a local build;
      # this job adds no build logic of its own. IMAGE selects the destination
      # (it is also the build.sh default). The runner is amd64, so the
      # linux/amd64 default is native, not emulated.
      - name: Build and push
        run: IMAGE="$PRAXIS_IMAGE" ./deploy/images/praxis-llm-d-sc/build.sh --push

      - name: Record digest
        run: |
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://$PRAXIS_IMAGE")"
          {
            echo "### gci-praxis (gateway)"
            echo "- \`$PRAXIS_IMAGE\` -> \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
