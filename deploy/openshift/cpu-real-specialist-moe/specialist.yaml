# Same Deployment as cpu-real-specialist (copied - kustomize cannot reference
# files outside the overlay directory); here it forwards to the MoE.
# CUAD QA checkpoint (single encoder pass); everything else is forwarded to
# the 1.5B general model that already runs as cpureal-vllm-cpu. The trace-ui
# CPU relay is re-pointed here, so praxis, the pipeline, the sensitive entry
# and the measurement harness all work unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpureal-specialist
  labels: {app: cpureal-specialist, demo.openshell.ai/pool: vllm-cpu, demo.openshell.ai/specialist: cuad-qa}
spec:
  replicas: 1
  selector: {matchLabels: {app: cpureal-specialist}}
  template:
    metadata:
      labels: {app: cpureal-specialist, demo.openshell.ai/pool: vllm-cpu, demo.openshell.ai/specialist: cuad-qa}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: specialist
          image: image-registry.openshift-image-registry.svc:5000/openshell-demo/hybrid-specialist:latest
          args: ["hybrid-specialist", "--model", "/opt/cuad-model/roberta-large",
                 "--host", "0.0.0.0", "--port", "8000",
                 "--concurrency", "4", "--null-margin", "1.0",
                 "--forward-to", "http://cpureal-vllm-cpu:8000"]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
          resources:
            # Guaranteed QoS (requests == limits) like the pools it fronts.
            # 2 physical cores: the isolation profile offlines the sibling
            # hyperthreads, so this is one whole core per request.
            requests: {cpu: "2", memory: 4Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: cpureal-specialist
spec:
  selector: {app: cpureal-specialist}
  ports: [{name: http, port: 8000, targetPort: 8000}]
