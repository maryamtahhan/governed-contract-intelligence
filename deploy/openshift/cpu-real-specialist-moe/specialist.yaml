# Same Deployment as cpu-real-specialist (copied - kustomize cannot reference
# files outside the overlay directory). The CPU route in this overlay points
# at the MoE; the specialist still answers only CUAD clauses and never
# forwards.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpureal-specialist
  labels: {app: cpureal-specialist, demo.openshell.ai/pool: cuad-specialist, demo.openshell.ai/specialist: cuad-qa}
spec:
  replicas: 1
  selector: {matchLabels: {app: cpureal-specialist}}
  template:
    metadata:
      labels: {app: cpureal-specialist, demo.openshell.ai/pool: cuad-specialist, demo.openshell.ai/specialist: cuad-qa}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: specialist
          image: image-registry.openshift-image-registry.svc:5000/openshell-demo/hybrid-specialist:latest
          args: ["hybrid-specialist", "--model", "/opt/cuad-model/roberta-large",
                 "--host", "0.0.0.0", "--port", "8000",
                 "--concurrency", "4", "--null-margin", "1.0"]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
          resources:
            # Guaranteed QoS (requests == limits) like the other pools.
            # 2 physical cores: the isolation profile offlines the sibling
            # hyperthreads, so this is one whole core per request.
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "2", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: cpureal-specialist
spec:
  selector: {app: cpureal-specialist}
  ports: [{name: http, port: 8000, targetPort: 8000}]
