apiVersion: batch/v1
kind: Job
metadata:
  name: moe-cache-seeder
  namespace: openshell-demo
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: moe-cache-seeder
    spec:
      restartPolicy: Never
      # no resources block on purpose: no memory limit means no cgroup OOM
      # from NFS dirty-page accounting while writing 67GiB (FINDINGS §7)
      containers:
        - name: seeder
          image: python:3.12-slim
          env:
            - {name: HOME, value: /tmp}
            - {name: HF_HOME, value: /cache/hf}
            - {name: HF_HUB_DISABLE_XET, value: "1"}
          command:
            - sh
            - -c
            - |
              set -e
              pip install --quiet --target /tmp/py huggingface_hub
              PYTHONPATH=/tmp/py python3 -c "
              from huggingface_hub import snapshot_download
              snapshot_download('Qwen/Qwen3.5-35B-A3B', max_workers=8)
              print('SEED COMPLETE')
              "
          volumeMounts:
            - {name: cache, mountPath: /cache}
      volumes:
        - name: cache
          persistentVolumeClaim: {claimName: model-cache}
