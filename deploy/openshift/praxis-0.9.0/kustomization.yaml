apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Opt-in gateway update for the ROSA overlay.
#
# This changes ONLY the gateway image: Praxis 0.7.5 + ai-gateway 0.9.0 with the
# llm_d_sc filter. The taxonomy, listeners, and routes stay exactly what
# deploy/openshift/rosa ships, so this is a like-for-like gateway swap and not
# a routing change.
#
# Apply it only after quay.io/mtahhan/gci-praxis:v0.9.0 exists (the
# publish-images workflow, or build.sh --push on an amd64 host). The base
# manifests intentionally keep the older, existing image until that is true;
# pointing them at a missing tag would turn every stack into ImagePullBackOff.
#
#   gh workflow run publish-images.yml
#   oc apply -k deploy/openshift/praxis-0.9.0
#
# Pin the digest in a quoted run:
#   oc -n openshell-demo get deploy/praxis \
#     -o jsonpath='{.spec.template.spec.containers[0].image}'
resources:
  - ../rosa

images:
  - name: quay.io/rmalone/praxis-ai-llm-d-sc
    newName: quay.io/mtahhan/gci-praxis
    newTag: v0.9.0
