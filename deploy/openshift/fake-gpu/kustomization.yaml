apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The CPU-only variant of the demo stack: everything from the base (real CPU
# pool, llm-d-sc, praxis, trace-ui, netpols) plus simulated GPU pools, with
# the real GPU InferenceServices scaled to zero. Switch back to the real GPU
# pools with `oc apply -k manifests` once the cluster has GPU nodes.
namespace: openshell-demo

resources:
  - ../../../manifests
  - fake-pools.yaml

patches:
  # Point the trace-ui relays at the simulated pools.
  - target:
      kind: Deployment
      name: trace-ui
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - {name: TRACE_DB_PATH, value: /data/traces.db}
          - {name: PRAXIS_UPSTREAM, value: "http://praxis:80"}
          - {name: SENSITIVE_UPSTREAM, value: "http://praxis:8083"}
          - {name: JUDGMENT_UPSTREAM, value: "http://praxis:8086"}
          - {name: SENSITIVE_JUDGMENT_UPSTREAM, value: "http://praxis:8087"}
          - {name: TRACE_POOLS, value: "vllm-cpu,vllm-gpu,vllm-gpu-approved,vllm-gpu-small"}
          - {name: VLLM_CPU_UPSTREAM, value: "http://vllm-cpu-predictor:80"}
          - {name: VLLM_GPU_UPSTREAM, value: "http://fake-vllm-gpu:8000"}
          - {name: VLLM_GPU_APPROVED_UPSTREAM, value: "http://fake-vllm-gpu-approved:8000"}
          - {name: VLLM_GPU_SMALL_UPSTREAM, value: "http://fake-vllm-gpu-small:8000"}
  # Park the real GPU pools at zero replicas until GPU nodes exist.
  - target:
      kind: InferenceService
      name: vllm-gpu
    patch: |-
      - op: replace
        path: /spec/predictor/minReplicas
        value: 0
  - target:
      kind: InferenceService
      name: vllm-gpu-approved
    patch: |-
      - op: replace
        path: /spec/predictor/minReplicas
        value: 0
  - target:
      kind: InferenceService
      name: vllm-gpu-small
    patch: |-
      - op: replace
        path: /spec/predictor/minReplicas
        value: 0
