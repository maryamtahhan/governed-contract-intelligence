# All-real, all-CPU variant for clusters without working accelerators.
#
# The CPU pool and the three "GPU" pools all run real vLLM (Qwen 2.5 1.5B on
# the CPU and small pools, 7B on the gpu/gpu-approved pools) served from CPU,
# so every component of the demo is real - models, routing, classification,
# governance, measurement - only the accelerator is absent. Quality and
# device-time from this variant are real measurements of CPU serving; the
# CPU-vs-GPU comparison itself comes from the GPU instance (see README).
#
# Pools are labelled demo.openshell.ai/accelerator=cpu so the dashboard and
# report cannot mistake this for the GPU deployment.
#
# CPU isolation: every pool is Guaranteed QoS (requests == limits, integer
# CPU). With the NTO PerformanceProfile in deploy/openshift/cpu-isolation,
# the sibling hyperthreads of the isolated cores are offlined, so one CPU
# request is one whole physical core and the static CPU manager gives each
# pod an exclusive set. The profile was generated from the real SNO
# topology (2026-11-03): 288 logical / 144 cores in SIX 24-core NUMA
# nodes. A 24-core pod needs a whole node under single-numa-node, so each
# 7B pool takes one; the 12/16-core pools and the specialist share the
# others. Base budget: 24 + 24 + 12 + 12 + 2 = 74 of the profile's 78
# isolated cores (4 idle on node4). The MoE/9B variants swap the 12-core
# CPU pool for 16: 78 of 78, an exact fit. The numbers are PHYSICAL cores.
# The earlier 48/48/24/24 were logical requests under full-pcpus-only,
# i.e. the same 24/24/12/12 physical cores: the offlining profile makes
# the mapping 1:1.
# Without the profile the pod still gets its full request (no CFS
# throttling) but shares cores with other pods; the manifest alone cannot
# enable the static policy. See deploy/openshift/cpu-isolation/README.md.
# Changing a request changes the CPU set and therefore the latency numbers:
# re-measure, do not splice old and new runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpureal-vllm-gpu
  labels: {app: cpureal-vllm-gpu, demo.openshell.ai/pool: vllm-gpu, demo.openshell.ai/accelerator: cpu}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: cpureal-vllm-gpu}}
  template:
    metadata:
      labels: {app: cpureal-vllm-gpu, demo.openshell.ai/pool: vllm-gpu, demo.openshell.ai/accelerator: cpu}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai-cpu:latest
          args: ["--model", "Qwen/Qwen2.5-7B-Instruct", "--served-model-name", "Semantic-Qwen",
                 "--port", "8000", "--max-model-len", "16384",
                 "--gpu-memory-utilization", "0.80"]
          env:
            - {name: HF_HOME, value: /cache/hf}
            # weights are PVC-cached; skip HF revision checks (immune to DNS flaps).
            # Disable for a first seed run on a fresh cluster.
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: HOME, value: /cache}
            - {name: XDG_CACHE_HOME, value: /cache/xdg}
            # Bind one OpenMP thread per physical core, one NUMA node per
            # rank; with siblings offlined this is 1 CPU = 1 core. vLLM
            # reserves one CPU for the framework, so N-1 threads run.
            - {name: VLLM_CPU_OMP_THREADS_BIND, value: auto}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 240, periodSeconds: 10}
          resources:
            requests: {cpu: "24", memory: 64Gi}
            limits: {cpu: "24", memory: 64Gi}
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: hf-cache, mountPath: /cache}
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
        - {name: hf-cache, persistentVolumeClaim: {claimName: model-cache}}
---
apiVersion: v1
kind: Service
metadata:
  name: cpureal-vllm-gpu
spec:
  selector: {app: cpureal-vllm-gpu}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
