# The CUAD specialist pool for ROSA: a model endpoint, not a router.
# Extraction prompts are answered by the fine-tuned RoBERTa-large QA
# checkpoint in one encoder pass. The MoE at cpureal-vllm-cpu is a separate
# praxis route, not a forwarding target; unsupported prompts fail with 400 so
# a misroute is visible. It runs on the tainted x8i node beside the pools.
#
# Unlike the vLLM pools this is a plain FastAPI/torch service, not an OMP
# process manager, so VLLM_CPU_OMP_THREADS_BIND does not apply. It is pinned
# the cheap way instead: taskset -c 16-17 (the two cores cpu-topology.sh
# assigns on NUMA 0, beside the MoE), and OMP_NUM_THREADS=2
# bounds torch intra-op threads to the same budget. The image is
# Debian-based, so taskset (util-linux) is present. With placement pinned,
# the CPU request != limit is safe here (no OMP manager to throttle), but it
# keeps the Guaranteed QoS of the SNO manifest.
#
# The image is built in-cluster (BuildConfig hybrid-specialist in this
# namespace); on 4.22 use the dockerfilePath + --from-dir workaround from
# scripts/cluster/model-comparison.sh - `oc start-build --dockerfile` is not
# supported by this server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpureal-specialist
  labels: {app: cpureal-specialist, demo.openshell.ai/pool: cuad-specialist, demo.openshell.ai/specialist: cuad-qa}
spec:
  replicas: 1
  selector: {matchLabels: {app: cpureal-specialist}}
  template:
    metadata:
      labels: {app: cpureal-specialist, demo.openshell.ai/pool: cuad-specialist, demo.openshell.ai/specialist: cuad-qa}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        demo.openshell.ai/node: cpu-infer
      tolerations:
        - {key: demo.openshell.ai/cpu-infer, operator: Exists, effect: NoSchedule}
      containers:
        - name: specialist
          image: image-registry.openshift-image-registry.svc:5000/openshell-demo/hybrid-specialist:latest
          # Pin to the cores cpu-topology.sh assigns (NUMA 0, beside the MoE);
          # taskset execs the console script, so args stay unchanged.
          command: ["taskset", "-c", "16-17"]
          args: ["hybrid-specialist", "--model", "/opt/cuad-model/roberta-large",
                 "--host", "0.0.0.0", "--port", "8000",
                 "--concurrency", "4", "--null-margin", "1.0"]
          env:
            # torch intra-op threads: match the request, not the node
            - {name: OMP_NUM_THREADS, value: "2"}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "2", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: cpureal-specialist
spec:
  selector: {app: cpureal-specialist}
  ports: [{name: http, port: 8000, targetPort: 8000}]
