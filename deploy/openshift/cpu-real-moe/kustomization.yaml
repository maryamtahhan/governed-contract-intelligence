apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CPU-pool model variant: Qwen3.5-35B-A3B (MoE, ~3B active params/token,
# 67 GiB bf16 weights). Stacks on cpu-real: everything else unchanged, only
# the cpureal-vllm-cpu deployment is re-pointed at the MoE.
#
# The bet: MoE decode only touches active experts, so per-token memory
# traffic is ~3B-class while total knowledge is 35B-class - potentially
# 7B-or-better judgment quality on the CPU pool. The honest risk: vLLM's
# CPU MoE kernels are the least battle-tested path; measure, don't assume.
#
# Apply with:  oc apply -k deploy/openshift/cpu-real-moe
# Compare with: arm D reruns on the same documents (runs/cuad-mixed/arm-D-*).
namespace: openshell-demo

resources:
  - ../cpu-real

patches:
  - target:
      kind: Deployment
      name: cpureal-vllm-cpu
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--model", "Qwen/Qwen3.5-35B-A3B", "--served-model-name", "Semantic-Qwen",
                "--port", "8000", "--max-model-len", "16384", "--max-num-seqs", "32",
                "--gpu-memory-utilization", "0.80",
                "--trust-remote-code", "--tensor-parallel-size", "1",
                "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder",
                "--reasoning-parser", "qwen3", "--mm-encoder-tp-mode", "data"]
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - {name: HF_HOME, value: /cache/hf}
          - {name: HOME, value: /cache}
          - {name: XDG_CACHE_HOME, value: /cache/xdg}
          - {name: VLLM_ENGINE_READY_TIMEOUT_S, value: "3600"}
          - {name: VLLM_CPU_OMP_THREADS_BIND, value: auto}
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          # Guaranteed QoS, physical cores: the isolation profile offlines
          # the sibling hyperthreads, so 16 CPUs = 16 whole cores, and
          # single-numa-node keeps the pod inside one 24-core NUMA node.
          requests: {cpu: "16", memory: 128Gi}
          limits: {cpu: "16", memory: 128Gi}
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 600, periodSeconds: 15}
      # emptyDir, not the PVC: writing the 72GB model through NFS
      # accumulates dirty pages in the container's memory cgroup (the NFS
      # server cannot flush fast enough) and the kernel OOM-kills the
      # downloader at any memory limit. Small models are fine on the PVC;
      # this one pays a ~25 min re-download per pod recreation instead.
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - {name: shm, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
          - {name: hf-cache, emptyDir: {sizeLimit: 90Gi}}
