# Adapted standalone manifest for praxis-proxy/policy's reference
# audit-logger, vendored from the v0.5.0 tag (see PPE_REF in build.sh —
# pinned to the tag, not main, because praxis-filter's published 0.7.5
# depends on the *released* praxis-policy 0.5.0, and main's plugin sources
# may use unreleased core APIs).
#
# The upstream Cargo.toml inherits every field from the PPE workspace; this
# copy pins the same dependencies as published crates so the crate builds
# inside the ai-gateway vendor tree. src/ is vendored unmodified.
#
# No [features] block: the crypto-backend feature split (crypto-rustcrypto
# / fips) is unreleased on the 0.5.0 line, so released praxis-policy-core
# 0.5.0 has no such features to forward to.
[package]
name = "praxis-policy-plugin-audit-logger"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false
description = "PPE CMF plugin — structured per-request audit logging (reference implementation, vendored by deploy/images/praxis-llm-d-sc)"

[dependencies]
# Must resolve to the same praxis-policy-core the praxis-filter umbrella
# (praxis-policy 0.5.0) pulls in; same package + version from crates.io
# unifies to one instance, which is what makes the PluginFactory trait
# here the same type register_policy_plugin_factory expects.
praxis-policy-core = "0.5.0"

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
