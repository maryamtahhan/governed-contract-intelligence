# gci-praxis-policy-host — host registrations for the PPE plugins the GCI
# gateway runs.
#
# The Praxis Policy Engine deliberately does not bundle its reference
# plugins (a test in praxis-proxy/policy enforces that `audit/logger` and
# `validator/pii-scan` are NOT registered by the umbrella crate): a host
# registers the kinds it wants before the server starts. This crate is that
# host registration for our gateway image. It is discovered through the
# same build-time mechanism as the llm_d_sc filter — the marker below makes
# the ai-gateway server's build.rs generate a call to register_filters() —
# and it exports no HTTP filters of its own; the generated registry
# parameter is unused.
#
# What gets registered:
#
#   audit/logger              the reference audit sink (vendored from the
#                             praxis-proxy/policy v0.5.0 tag alongside this
#                             crate by build.sh). Emits one JSON decision
#                             record per request when a policy names it.
#   validator/gci-pii-observe an observe-only PII scanner written here,
#                             modeled on the reference validator/pii-scan.
#                             It NEVER denies and NEVER rewrites; it logs
#                             one structured line per scanned request so
#                             the gateway-side screen can be measured
#                             against the pipeline's client-side screen
#                             (demo/src/hybrid_demo/pii.py).
#   validator/gci-pii-gate    the same scanner and pattern catalog in
#                             enforcing mode: the general entry denies a
#                             match (403) so a client cannot route PII
#                             around the pipeline's sensitive screen.
#   validator/gci-step-key    binds the authenticated API-key subject to
#                             the `step:<stage>` grant for X-Demo-Step,
#                             including the eval key's stepless exception.
[package]
name = "gci-praxis-policy-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
description = "GCI gateway host registrations: PPE reference audit sink, PII observe/gate scanners, and the step-key binding gate"

# Marker consumed by the Praxis server's build-time filter discovery
# (server/build.rs walks cargo metadata looking for this key).
[package.metadata.praxis-filters]

[dependencies]
async-trait = "0.1"
# Default features include `policy-engine`, which is what provides
# register_policy_plugin_factory. The ai-gateway build enables it too, so
# the features unify to one instance of praxis-filter in the graph.
praxis-filter = { package = "praxis-proxy-filter", version = "0.7.5" }
# Must resolve to the same praxis-policy-core the PUBLISHED praxis-filter
# 0.7.5 pulls in — that is 0.4.1 (praxis main has bumped to 0.5.0 but no
# release carries it). A different core here means the PluginFactory trait
# this crate implements is a different type than the one
# register_policy_plugin_factory expects, and the build fails with two
# praxis-policy-core copies in the graph. Bump together with PPE_REF.
praxis-policy-core = "0.4.1"
praxis-policy-plugin-audit-logger = { path = "../praxis-policy-plugin-audit-logger" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
